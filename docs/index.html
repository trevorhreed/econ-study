// ─── GLOSSARY ───────────────────────────────────────────────────────
const GLOSSARY = {
  "equilibrium": "The price-quantity point where supply meets demand; the market clears with no surplus or shortage.",
  "equilibrium price": "The price at which quantity demanded equals quantity supplied.",
  "equilibrium quantity": "The quantity traded when the market is at equilibrium.",
  "demand shock": "An unexpected event that shifts the demand curve — a change in tastes, income, population, related prices, or expectations.",
  "supply shock": "An unexpected event that shifts the supply curve — a change in input costs, technology, regulation, or natural conditions.",
  "shock": "An external event that shifts supply or demand. Demand shocks shift the demand curve; supply shocks shift the supply curve. Distinct from a movement along the curve caused by the good's own price.",
  "consumer surplus": "The difference between what consumers are willing to pay and what they actually pay. Area below demand, above price.",
  "producer surplus": "The difference between the market price and sellers' cost. Area above supply, below price.",
  "total surplus": "Consumer surplus + Producer surplus. Measures total net benefit from trade.",
  "deadweight loss": "Lost total surplus from a market distortion (tax, price control, monopoly). Trades that should happen but don't.",
  "dwl": "Deadweight loss — lost surplus from a distortion.",
  "elasticity": "How responsive quantity is to a price change. High = very responsive; low = unresponsive.",
  "inelastic": "Low responsiveness to price. Steep curve. Think necessities.",
  "elastic": "High responsiveness to price. Flat curve. Think luxuries with substitutes.",
  "price ceiling": "Legal maximum price. Binding below equilibrium → shortage.",
  "price floor": "Legal minimum price. Binding above equilibrium → surplus.",
  "shortage": "Qd > Qs. Price held below equilibrium.",
  "surplus": "Qs > Qd. Price held above equilibrium. (Not consumer/producer surplus.)",
  "tax wedge": "Gap between buyer price and seller price, equal to the tax.",
  "statutory incidence": "Who legally pays the tax.",
  "economic incidence": "Who actually bears the tax burden (may differ from statutory).",
  "laffer curve": "As tax rates rise, revenue first increases then decreases (high taxes destroy the tax base).",
  "marginal cost": "Additional cost of one more unit. Key: firms compare MC to price/MR.",
  "mc": "Marginal cost — cost of one additional unit.",
  "average total cost": "Total cost ÷ quantity. U-shaped: spreading fixed costs, then rising marginal costs.",
  "atc": "Average total cost — TC / Q.",
  "average fixed cost": "Fixed costs ÷ quantity. Always declining.",
  "afc": "Average fixed cost — FC / Q.",
  "average variable cost": "Variable costs ÷ quantity. Eventually rising.",
  "avc": "Average variable cost — VC / Q.",
  "fixed costs": "Costs that don't change with output (rent, equipment). Present even at Q = 0.",
  "variable costs": "Costs that change with output (materials, hourly labor).",
  "total cost": "Fixed costs + variable costs.",
  "economies of scale": "Increasing production lowers ATC. Typical at low output.",
  "diseconomies of scale": "Increasing production raises ATC. Coordination problems at high output.",
  "diminishing marginal returns": "Adding more of one input (holding others fixed) eventually yields less additional output.",
  "efficient scale": "Quantity that minimizes ATC. Where MC crosses ATC.",
  "monopoly": "Single seller, no close substitutes, high barriers to entry.",
  "market power": "Ability to set price above MC. Price maker, not price taker.",
  "price maker": "Firm that can choose its price (has market power).",
  "price taker": "Firm that accepts the market price — too small to influence it.",
  "marginal revenue": "Additional revenue from one more unit. For monopoly: MR < P.",
  "mr": "Marginal revenue — extra revenue from one more unit.",
  "natural monopoly": "One firm can supply the market at lower ATC than multiple firms. ATC still declining at market-relevant Q.",
  "price discrimination": "Charging different prices to different consumers for the same good.",
  "allocative efficiency": "Resources produce the combination of goods most valued by society. P = MC.",
  "productive efficiency": "Goods produced at lowest possible cost. Minimum of ATC.",
  "pareto efficiency": "No one can be made better off without making someone worse off.",
  "welfare economics": "Study of how resource allocation affects well-being (CS, PS, total surplus).",
  "opportunity cost": "Value of the next-best alternative you give up. The true cost of anything.",
  "comparative advantage": "Ability to produce at lower opportunity cost than another. Basis for trade.",
  "absolute advantage": "Ability to produce using fewer inputs. Does NOT determine who should specialize.",
  "production possibilities frontier": "Max combinations of two goods an economy can produce. On = efficient, inside = inefficient, outside = unattainable.",
  "ppf": "Production possibilities frontier.",
  "marginal thinking": "Comparing additional benefit to additional cost. Rational people think at the margin.",
  "sunk cost": "Already-incurred, unrecoverable cost. Should be ignored in decisions.",
  "price elasticity of demand": "% change in Qd / % change in P. How responsive buyers are.",
  "price elasticity of supply": "% change in Qs / % change in P. How responsive sellers are.",
  "income elasticity of demand": "% change in Qd / % change in income. Positive = normal, negative = inferior.",
  "cross-price elasticity": "% change in Qd of A / % change in P of B. Positive = substitutes, negative = complements.",
  "unit elastic": "Elasticity = 1. % change in Q equals % change in P.",
  "total revenue": "Price × Quantity.",
  "externality": "Cost or benefit affecting a third party not in the transaction.",
  "negative externality": "Cost on third parties (pollution). Market overproduces.",
  "positive externality": "Benefit to third parties (education). Market underproduces.",
  "social cost": "Private cost + external cost.",
  "social benefit": "Private benefit + external benefit.",
  "pigouvian tax": "Tax to correct a negative externality. Makes private cost = social cost.",
  "coase theorem": "With clear property rights and low transaction costs, private parties can solve externalities without government.",
  "public good": "Non-excludable and non-rivalrous. National defense, street lighting.",
  "private good": "Excludable and rivalrous. Most goods.",
  "common resource": "Rivalrous but non-excludable. Prone to overuse. Fish in the ocean.",
  "club good": "Excludable but non-rivalrous. Cable TV, uncrowded toll roads.",
  "free rider": "Gets benefit without paying. Central problem with public goods.",
  "tragedy of the commons": "Common resources overused because no one has incentive to conserve.",
  "excludable": "People can be prevented from using it.",
  "rivalrous": "One person's use reduces availability for others.",
  "competitive market": "Many buyers/sellers, identical products, free entry/exit. Each firm is a price taker.",
  "profit maximization": "Produce where MR = MC.",
  "shutdown condition": "Shut down short-run if P < AVC. Exit long-run if P < ATC.",
  "zero economic profit": "Revenue covers all costs including opportunity costs. Normal return, not above-normal.",
  "long-run supply": "Entry/exit drive profit to zero. More elastic than short-run.",
  "monopolistic competition": "Many firms, differentiated products, free entry/exit. Some market power.",
  "product differentiation": "Making product distinct via branding, quality, features. Source of market power in mon. comp.",
  "oligopoly": "Few sellers, strategic interdependence. Each firm's profit depends on rivals' choices.",
  "game theory": "Study of strategic decision-making with multiple players.",
  "nash equilibrium": "Each player doing best given others' choices. No one wants to unilaterally change.",
  "prisoners dilemma": "Individual rationality → collectively worse outcome. Incentive to defect despite mutual cooperation being better.",
  "cartel": "Firms colluding to restrict output and raise price. Illegal, inherently unstable.",
  "collusion": "Agreement among firms to fix prices or restrict output.",
  "dominant strategy": "Best strategy regardless of what others do.",
  "world price": "Price prevailing in the world market.",
  "tariff": "Tax on imports. Raises domestic price, creates DWL.",
  "import quota": "Limit on quantity of imports.",
  "terms of trade": "Rate at which goods exchange between countries.",
  "infant industry": "New domestic industry needing temporary protection.",
  "benefits principle": "Tax based on benefits received from government.",
  "ability-to-pay principle": "Tax based on capacity to bear the burden.",
  "horizontal equity": "Similar ability to pay → similar taxes.",
  "vertical equity": "Greater ability to pay → larger taxes.",
  "progressive tax": "Higher income → higher fraction paid.",
  "regressive tax": "Higher income → lower fraction paid.",
  "proportional tax": "Same fraction regardless of income.",
  "marginal tax rate": "Extra tax on the next dollar of income.",
  "average tax rate": "Total tax / total income.",
  "factors of production": "Inputs: labor, land, capital.",
  "marginal product of labor": "Extra output from one more worker.",
  "value of the marginal product": "MPL × output price. What a firm will pay for one more unit of input.",
  "derived demand": "Demand for a factor derived from demand for the goods it produces.",
  "human capital": "Knowledge, skills, experience making a worker more productive.",
  "compensating differential": "Wage difference offsetting non-monetary job characteristics.",
  "efficiency wages": "Above-equilibrium wages to boost productivity.",
  "signaling": "Action by informed party to reveal private info (education signals ability).",
  "discrimination": "Different opportunities/wages to equally productive workers based on personal characteristics.",
  "poverty rate": "% of population below the poverty line.",
  "poverty line": "Government-set income threshold.",
  "in-kind transfers": "Non-cash benefits (food stamps, Medicaid). Not counted in income stats.",
  "utilitarian": "Maximize total utility. Supports redistribution via diminishing marginal utility.",
  "liberal": "Rawlsian: maximize welfare of worst-off (maximin).",
  "libertarian": "Protect individual rights, minimal redistribution. Process fairness over outcome equality.",
  "budget constraint": "Limit on affordable consumption bundles given income and prices.",
  "indifference curve": "Combinations of goods giving equal satisfaction. Higher = better.",
  "marginal rate of substitution": "Rate consumer trades one good for another at same satisfaction. Slope of indifference curve.",
  "income effect": "Consumption change from price change making consumer richer/poorer.",
  "substitution effect": "Consumption change from price change making one good relatively cheaper.",
  "giffen good": "Price increase raises Qd. Extremely rare. Income effect dominates substitution effect for inferior good.",
  "moral hazard": "Unmonitored party behaves carelessly (insured driver drives recklessly).",
  "adverse selection": "Unobserved attributes become undesirable mix (sick people buy more insurance).",
  "principal-agent problem": "Agent may not act in principal's best interest.",
  "condorcet paradox": "Majority rule fails to produce transitive social preferences.",
  "arrows impossibility theorem": "No voting system satisfies all desirable properties with 3+ choices.",
  "median voter theorem": "Majority rule outcome reflects median voter's preference.",
};

// ─── COMPONENTS ─────────────────────────────────────────────────────

function TermTip({ term, children }) {
  const [show, setShow] = useState(false);
  const key = term.toLowerCase();
  const def = GLOSSARY[key];
  if (!def) return <span style={{ color: C.accent, fontWeight: 200 }}>{children || term}</span>;
  return (
    <span style={{ position: "relative", display: "inline" }}
      onMouseEnter={() => setShow(true)} onMouseLeave={() => setShow(false)}>
      <span style={{ color: C.accent, borderBottom: `1px dashed ${C.accent}88`, cursor: "help", fontWeight: 200, transition: "color 0.2s ease" }}>
        {children || term}
      </span>
      {show && (
        <span style={{
          position: "absolute", bottom: "calc(100% + 10px)", left: "50%", transform: "translateX(-50%)",
          ...glassPanel, background: "rgba(15,15,30,0.95)", backdropFilter: "blur(28px)",
          padding: "16px 20px", fontSize: 18, lineHeight: 1.65, color: "rgba(255,255,255,0.85)", width: 340, zIndex: 1000,
          boxShadow: "0 16px 48px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08)",
          animation: "tooltipIn 0.2s ease",
        }}>
          <span style={{ fontWeight: 200, color: C.accent, display: "block", marginBottom: 6, textTransform: "capitalize", fontSize: 18, letterSpacing: 0.3 }}>{term}</span>
          {def}
        </span>
      )}
    </span>
  );
}

function T({ t, children }) { return <TermTip term={t}>{children}</TermTip>; }

// ─── RESET BUTTON ───────────────────────────────────────────────────

function ResetButton({ onClick, disabled }) {
  return (
    <button onClick={disabled ? undefined : onClick} style={{
      ...glassPanel, padding: "8px 18px", cursor: disabled ? "default" : "pointer", fontFamily: F.body,
      fontSize: 18, color: disabled ? "rgba(255,255,255,0.15)" : C.textMuted,

    onMouseLeave={e => { e.target.style.color = disabled ? "rgba(255,255,255,0.15)" : C.textMuted; e.target.style.background = "transparent"; }}
    >↺ Reset</button>
  );
}

function SupplyDemandGraph() {
  const [mode, setMode] = useState("free");
  const data = [];
  for (let q = 0; q <= 100; q += 2) data.push({ q, demand: 100 - q, supply: 10 + 0.8 * q });
  const eqQ = 50, eqP = 50;
  const controlledPrice = mode === "ceiling" ? 30 : mode === "floor" ? 70 : null;

  return (
    <div style={{ margin: "28px 0" }}>
      <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap", alignItems: "center" }}>
        {["free", "ceiling", "floor"].map(m => (
          <button key={m} onClick={() => setMode(m)} style={{
            padding: "10px 18px", borderRadius: 10, fontSize: 20, fontFamily: F.body, cursor: "pointer",
            ...glassPanel, background: mode === m ? C.accentDim : C.glass,
            borderColor: mode === m ? C.accent + "44" : C.glassBorder,
            color: mode === m ? C.accent : C.textMuted, fontWeight: mode === m ? 500 : 300,
          }}>
            {m === "free" ? "Free Market" : m === "ceiling" ? "Price Ceiling ($30)" : "Price Floor ($70)"}
          </button>
        ))}
        <ResetButton disabled={mode === "free"} onClick={() => setMode("free")} />
      </div>
      <ResponsiveContainer width="100%" height={320}>
        <ComposedChart data={data} margin={{ top: 10, right: 20, bottom: 20, left: 20 }}>
          <CartesianGrid strokeDasharray="3 3" stroke={C.gridLine} />
          <XAxis dataKey="q" label={{ value: "Quantity", position: "bottom", fill: C.textMuted, fontSize: 18 }} tick={{ fill: C.textMuted, fontSize: 18 }} stroke={C.gridLine} />
          <YAxis domain={[0, 110]} label={{ value: "Price ($)", angle: -90, position: "insideLeft", fill: C.textMuted, fontSize: 18 }} tick={{ fill: C.textMuted, fontSize: 18 }} stroke={C.gridLine} />
          <Line type="linear" dataKey="demand" stroke={C.demand} strokeWidth={2.5} dot={false} isAnimationActive={false} />
          <Line type="linear" dataKey="supply" stroke={C.supply} strokeWidth={2.5} dot={false} isAnimationActive={false} />
          <ReferenceDot x={eqQ} y={eqP} r={6} fill={C.green} stroke={C.green} isAnimationActive={false} />
          {controlledPrice && (
            <ReferenceLine y={controlledPrice} stroke={C.yellow} strokeWidth={2} strokeDasharray="8 4">
              <Label value={mode === "ceiling" ? "Ceiling" : "Floor"} fill={C.yellow} fontSize={18} position="right" />
            </ReferenceLine>
          )}
        </ComposedChart>
      </ResponsiveContainer>
      <div style={{ ...glassCard, fontSize: 22, lineHeight: 1.7, color: C.text, marginTop: 10 }}>
        {mode === "free" && <><strong style={{ color: C.green }}>Equilibrium:</strong> P = $50, Q = 50. All mutually beneficial trades occur.</>}
        {mode === "ceiling" && <><strong style={{ color: C.yellow }}>Price Ceiling at $30:</strong> Qd ≈ 70, Qs ≈ 25. <strong>Shortage of ~45 units.</strong> Black markets, queues, quality degradation.</>}
        {mode === "floor" && <><strong style={{ color: C.yellow }}>Price Floor at $70:</strong> Qs ≈ 75, Qd ≈ 30. <strong>Surplus of ~45 units.</strong> Think minimum wage.</>}
      </div>
    </div>
  );
}

function TaxWedgeGraph() {
  const [taxRate, setTaxRate] = useState(20);
  const [demandSlope, setDemandSlope] = useState(1.0);
  const [supplySlope, setSupplySlope] = useState(0.8);
  const containerRef = useRef(null);
  const [tri, setTri] = useState(null);

  const sd = demandSlope, ss = supplySlope, eqP = 50, eqQ = 50;
  const newQ = Math.max(0, Math.min(100, 50 - taxRate / (sd + ss)));
  const pBuyers = (50 + 50 * sd) - sd * newQ;
  const pSellers = (50 - 50 * ss) + ss * newQ;
  const revenue = Math.round(taxRate * newQ);
  const dwl = Math.round(0.5 * taxRate * (eqQ - newQ));
  const buyerBurden = Math.round(pBuyers - eqP);
  const sellerBurden = Math.round(eqP - pSellers);
  const buyerPct = taxRate > 0 ? Math.round((ss / (sd + ss)) * 100) : 0;
  const sellerPct = taxRate > 0 ? 100 - buyerPct : 0;

  const data = [];
  for (let q = 0; q <= 100; q += 2) {
    const pD = (50 + 50 * sd) - sd * q;
    const pS = (50 - 50 * ss) + ss * q;
    data.push({ q,
      demand: pD >= 0 && pD <= 110 ? Math.round(pD * 10) / 10 : null,
      supply: pS >= 0 && pS <= 110 ? Math.round(pS * 10) / 10 : null
    });
  }

  const measurePlotArea = () => {
    if (!containerRef.current) return;
    const gridBg = containerRef.current.querySelector(".recharts-cartesian-grid-bg") || containerRef.current.querySelector(".recharts-cartesian-grid rect");
    const svgEl = containerRef.current.querySelector("svg.recharts-surface") || containerRef.current.querySelector("svg");
    if (!gridBg || !svgEl) return;
    const gr = gridBg.getBoundingClientRect(), sr = svgEl.getBoundingClientRect();
    const left = gr.left - sr.left, top = gr.top - sr.top, w = gr.width, h = gr.height;
    const toX = (q) => left + (q / 100) * w;
    const toY = (p) => top + (1 - p / 110) * h;
    setTri({ x0: toX(0), x1: toX(newQ), y1: toY(pBuyers), x2: toX(eqQ), y2: toY(eqP), x3: toX(newQ), y3: toY(pSellers) });
  };
  useEffect(() => { const t = setTimeout(measurePlotArea, 150); return () => clearTimeout(t); }, [taxRate, demandSlope, supplySlope]);
  useEffect(() => { const h = () => setTimeout(measurePlotArea, 150); window.addEventListener("resize", h); return () => window.removeEventListener("resize", h); }, [taxRate, demandSlope, supplySlope]);

  const sliderRow = (label, value, setValue, min, max, step, color, desc) => (
    <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 8, flexWrap: "wrap" }}>
      <label style={{ fontSize: 20, color: C.textMuted, minWidth: 220 }}>{label}: <span style={{ color, fontWeight: 200 }}>{typeof value === "number" && value % 1 !== 0 ? value.toFixed(1) : value}</span> <span style={{ fontSize: 18, opacity: 0.7 }}>({desc})</span></label>
      <input type="range" min={min} max={max} step={step} value={value}
        onChange={e => setValue(Number(e.target.value))} style={{ flex: 1, minWidth: 100, accentColor: color }} />
    </div>
  );

  return (
    <div style={{ margin: "28px 0" }}>
      {sliderRow("Tax amount", taxRate, setTaxRate, 0, 60, 1, C.yellow, `$${taxRate}`)}
      {sliderRow("Demand slope", demandSlope, setDemandSlope, 0.2, 3.0, 0.1, C.demand, demandSlope >= 2 ? "inelastic" : demandSlope <= 0.5 ? "elastic" : "moderate")}
      {sliderRow("Supply slope", supplySlope, setSupplySlope, 0.2, 3.0, 0.1, C.supply, supplySlope >= 2 ? "inelastic" : supplySlope <= 0.5 ? "elastic" : "moderate")}
      <ResetButton disabled={taxRate === 20 && demandSlope === 1.0 && supplySlope === 0.8} onClick={() => { setTaxRate(20); setDemandSlope(1.0); setSupplySlope(0.8); }} />
      <div style={{ display: "flex", gap: 16, marginBottom: 8, fontSize: 18, color: C.textMuted, flexWrap: "wrap" }}>
        <span><span style={{ display: "inline-block", width: 16, height: 3, background: C.demand, marginRight: 6, verticalAlign: "middle" }} />Demand</span>
        <span><span style={{ display: "inline-block", width: 16, height: 3, background: C.supply, marginRight: 6, verticalAlign: "middle" }} />Supply</span>
        {taxRate > 0 && <span><span style={{ display: "inline-block", width: 12, height: 12, background: `${C.yellow}22`, border: `1px dashed ${C.yellow}`, marginRight: 6, verticalAlign: "middle" }} />Tax Revenue</span>}
        {taxRate > 0 && <span><span style={{ display: "inline-block", width: 12, height: 12, background: C.dwl, border: `1px dashed ${C.red}`, marginRight: 6, verticalAlign: "middle" }} />DWL</span>}
      </div>
      <div ref={containerRef} style={{ position: "relative" }}>
        {taxRate > 0 && tri && (
          <svg style={{ position: "absolute", top: 0, left: 0, width: "100%", height: 320, pointerEvents: "none", zIndex: 5 }}>
            <rect x={tri.x0} y={tri.y1} width={tri.x1 - tri.x0} height={tri.y3 - tri.y1} fill={`${C.yellow}18`} stroke={C.yellow} strokeWidth={1} strokeDasharray="4 2" />
            <text x={tri.x0 + (tri.x1 - tri.x0) / 2} y={tri.y1 + (tri.y3 - tri.y1) / 2 + 4} fill={C.yellow} fontSize={18} fontWeight={700} textAnchor="middle">Revenue</text>
            <polygon points={`${tri.x1},${tri.y1} ${tri.x2},${tri.y2} ${tri.x3},${tri.y3}`} fill={C.dwl} stroke={C.red} strokeWidth={1.5} strokeDasharray="4 2" />
            <text x={(tri.x1 + tri.x2 + tri.x3) / 3 - 8} y={(tri.y1 + tri.y2 + tri.y3) / 3 + 4} fill={C.red} fontSize={18} fontWeight={700}>DWL</text>
          </svg>
        )}
        <ResponsiveContainer width="100%" height={320}>
          <ComposedChart data={data} margin={{ top: 10, right: 20, bottom: 20, left: 20 }}>
            <CartesianGrid strokeDasharray="3 3" stroke={C.gridLine} fill="transparent" />
            <XAxis dataKey="q" label={{ value: "Quantity", position: "bottom", fill: C.textMuted, fontSize: 18 }} tick={{ fill: C.textMuted, fontSize: 18 }} stroke={C.gridLine} />
            <YAxis domain={[0, 110]} label={{ value: "Price ($)", angle: -90, position: "insideLeft", fill: C.textMuted, fontSize: 18 }} tick={{ fill: C.textMuted, fontSize: 18 }} stroke={C.gridLine} />
            <Line type="linear" dataKey="demand" stroke={C.demand} strokeWidth={2.5} dot={false} connectNulls={false} isAnimationActive={false} />
            <Line type="linear" dataKey="supply" stroke={C.supply} strokeWidth={2.5} dot={false} connectNulls={false} isAnimationActive={false} />
            {taxRate > 0 && (
              <>
                <ReferenceLine y={pBuyers} stroke={C.demand} strokeDasharray="6 3" strokeWidth={1.5}><Label value={`Buyers: $${Math.round(pBuyers)}`} fill={C.demand} fontSize={18} position="right" /></ReferenceLine>
                <ReferenceLine y={pSellers} stroke={C.supply} strokeDasharray="6 3" strokeWidth={1.5}><Label value={`Sellers: $${Math.round(pSellers)}`} fill={C.supply} fontSize={18} position="right" /></ReferenceLine>
                <ReferenceLine x={newQ} stroke={C.textMuted} strokeDasharray="4 4"><Label value={`Q=${Math.round(newQ)}`} fill={C.textMuted} fontSize={18} position="top" /></ReferenceLine>
              </>
            )}
          </ComposedChart>
        </ResponsiveContainer>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(110px, 1fr))", gap: 8, marginTop: 8 }}>
        {[
          { label: "Tax Wedge", value: `$${taxRate}`, color: C.yellow },
          { label: "Quantity", value: Math.round(newQ), color: C.text },
          { label: "Revenue", value: `$${revenue}`, color: C.yellow },
          { label: "DWL", value: `≈$${dwl}`, color: C.red },
          { label: "Buyer %", value: `${buyerPct}%`, color: C.demand },
          { label: "Seller %", value: `${sellerPct}%`, color: C.supply },
        ].map(({ label, value, color }) => (
          <div key={label} style={{ ...glassCard, textAlign: "center", padding: "10px" }}>
            <div style={{ fontSize: 18, color: C.textMuted }}>{label}</div>
            <div style={{ fontSize: 24, fontWeight: 200, color, fontFamily: F.mono }}>{value}</div>
          </div>
        ))}
      </div>
      {taxRate > 0 && (
        <div style={{ ...glassCard, fontSize: 22, lineHeight: 1.7, color: C.text, marginTop: 10 }}>
          {buyerPct > sellerPct ? <>The <strong style={{ color: C.demand }}>more inelastic</strong> side (demand) bears {buyerPct}% of the tax — buyers can't easily leave the market.</>
            : buyerPct < sellerPct ? <>The <strong style={{ color: C.supply }}>more inelastic</strong> side (supply) bears {sellerPct}% — sellers can't easily exit.</>
            : <>Burden split equally — both curves have the same elasticity at equilibrium.</>}
        </div>
      )}
    </div>
  );
}

          <button key={k} onClick={() => setShow(p => ({ ...p, [k]: !p[k] }))} style={{

          <YAxis domain={[0, 120]} label={{ value: "Cost ($)", angle: -90, position: "insideLeft", fill: C.textMuted, fontSize: 18 }} tick={{ fill: C.textMuted, fontSize: 18 }} stroke={C.gridLine} />

          {show.atc && <Line type="monotone" dataKey="atc" stroke={C.atc} strokeWidth={2.5} dot={false} isAnimationActive={false} name="ATC" />}

      </div>

  );
}

function MarketShocksGraph() {
  const [dShift, setDShift] = useState(0);
  const [sShift, setSShift] = useState(0);
  const containerRef = useRef(null);
  const [plotArea, setPlotArea] = useState(null);
  const baseEqQ = 50, baseEqP = 50;
  // Demand: P = (100 + dShift) - Q. Supply: P = (10 + sShift) + 0.8Q
  // Eq: (100 + dShift) - Q = (10 + sShift) + 0.8Q → Q = (90 + dShift - sShift) / 1.8
  const newEqQ = Math.max(2, Math.min(98, (90 + dShift - sShift) / 1.8));
  const newEqP = (100 + dShift) - newEqQ;
  const data = [];
  for (let q = 0; q <= 100; q += 2) {
    const bD = 100 - q, bS = 10 + 0.8 * q, sD = bD + dShift, sS = bS + sShift;
    data.push({ q,
      baseDemand: bD >= 0 && bD <= 130 ? Math.round(bD * 10) / 10 : null,
      baseSupply: bS >= 0 && bS <= 130 ? Math.round(bS * 10) / 10 : null,
      demand: sD >= 0 && sD <= 130 ? Math.round(sD * 10) / 10 : null,
      supply: sS >= 0 && sS <= 130 ? Math.round(sS * 10) / 10 : null,
    });
  }
  const pChg = Math.round(newEqP - baseEqP), qChg = Math.round(newEqQ - baseEqQ);

  const measurePlot = () => {
    if (!containerRef.current) return;
    const grid = containerRef.current.querySelector(".recharts-cartesian-grid-bg") || containerRef.current.querySelector(".recharts-cartesian-grid rect");
    const svg = containerRef.current.querySelector("svg.recharts-surface") || containerRef.current.querySelector("svg");
    if (!grid || !svg) return;
    const gr = grid.getBoundingClientRect(), sr = svg.getBoundingClientRect();
    setPlotArea({ left: gr.left - sr.left, top: gr.top - sr.top, width: gr.width, height: gr.height });
  };
  useEffect(() => { const t = setTimeout(measurePlot, 150); return () => clearTimeout(t); }, [dShift, sShift]);
  useEffect(() => { const h = () => setTimeout(measurePlot, 150); window.addEventListener("resize", h); return () => window.removeEventListener("resize", h); }, []);

  const toX = (q) => plotArea ? plotArea.left + (q / 100) * plotArea.width : 0;
  const toY = (p) => plotArea ? plotArea.top + (1 - p / 130) * plotArea.height : 0;

  const sldr = (label, value, setValue, color, descFn) => (
    <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 8, flexWrap: "wrap" }}>
      <label style={{ fontSize: 20, color: C.textMuted, minWidth: 220 }}>{label}: <span style={{ color, fontWeight: 200 }}>{value > 0 ? "+" : ""}{value}</span> <span style={{ fontSize: 18, opacity: 0.7 }}>({descFn(value)})</span></label>
      <input type="range" min={-40} max={40} step={5} value={value} onChange={e => setValue(Number(e.target.value))} style={{ flex: 1, minWidth: 100, accentColor: color }} />
    </div>
  );
  return (
    <div style={{ margin: "28px 0" }}>
      {sldr("Demand shift", dShift, setDShift, C.demand, v => v > 0 ? "increase" : v < 0 ? "decrease" : "no shift")}
      {sldr("Supply shift", sShift, setSShift, C.supply, v => v > 0 ? "decrease (cost↑)" : v < 0 ? "increase (cost↓)" : "no shift")}
      <ResetButton disabled={dShift === 0 && sShift === 0} onClick={() => { setDShift(0); setSShift(0); }} />
      <div ref={containerRef} style={{ position: "relative" }}>
        {plotArea && (
          <svg style={{ position: "absolute", top: 0, left: 0, width: "100%", height: 340, pointerEvents: "none", zIndex: 5 }}>
            <circle cx={toX(baseEqQ)} cy={toY(baseEqP)} r={5} fill={C.green} opacity={0.3} />
            {(dShift !== 0 || sShift !== 0) && (
              <circle cx={toX(newEqQ)} cy={toY(newEqP)} r={7} fill={C.green} stroke={C.green} strokeWidth={2} />
            )}
          </svg>
        )}
        <ResponsiveContainer width="100%" height={340}>
          <ComposedChart data={data} margin={{ top: 10, right: 20, bottom: 20, left: 20 }}>
            <CartesianGrid strokeDasharray="3 3" stroke={C.gridLine} fill="transparent" />
            <XAxis dataKey="q" label={{ value: "Quantity", position: "bottom", fill: C.textMuted, fontSize: 18 }} tick={{ fill: C.textMuted, fontSize: 18 }} stroke={C.gridLine} />
            <YAxis domain={[0, 130]} label={{ value: "Price ($)", angle: -90, position: "insideLeft", fill: C.textMuted, fontSize: 18 }} tick={{ fill: C.textMuted, fontSize: 18 }} stroke={C.gridLine} />
            <Line type="linear" dataKey="baseDemand" stroke={C.demand} strokeWidth={1.5} dot={false} strokeOpacity={0.25} connectNulls={false} isAnimationActive={false} />
            <Line type="linear" dataKey="baseSupply" stroke={C.supply} strokeWidth={1.5} dot={false} strokeOpacity={0.25} connectNulls={false} isAnimationActive={false} />
            <Line type="linear" dataKey="demand" stroke={C.demand} strokeWidth={2.5} dot={false} connectNulls={false} isAnimationActive={false} />
            <Line type="linear" dataKey="supply" stroke={C.supply} strokeWidth={2.5} dot={false} connectNulls={false} isAnimationActive={false} />
          </ComposedChart>
        </ResponsiveContainer>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 8 }}>
        {[{ label: "Eq. Price", value: `$${Math.round(newEqP)}`, sub: pChg !== 0 ? `(${pChg > 0 ? "+" : ""}${pChg})` : "", color: pChg > 0 ? C.red : pChg < 0 ? C.green : C.text },
          { label: "Eq. Quantity", value: Math.round(newEqQ), sub: qChg !== 0 ? `(${qChg > 0 ? "+" : ""}${qChg})` : "", color: qChg > 0 ? C.green : qChg < 0 ? C.red : C.text }
        ].map(({ label, value, sub, color }) => (
          <div key={label} style={{ ...glassCard, textAlign: "center" }}>
            <div style={{ fontSize: 18, color: C.textMuted }}>{label}</div>
            <div style={{ fontSize: 24, fontWeight: 200, color, fontFamily: F.mono }}>{value} <span style={{ fontSize: 18 }}>{sub}</span></div>
          </div>
        ))}
      </div>
      <div style={{ ...glassCard, fontSize: 22, lineHeight: 1.7, color: C.text, marginTop: 10 }}>
        {dShift === 0 && sShift === 0 && <>Use the sliders to shift demand or supply and watch the equilibrium respond.</>}
        {dShift > 0 && sShift === 0 && <>Demand ↑ → <strong>Price ↑, Quantity ↑.</strong></>}
        {dShift < 0 && sShift === 0 && <>Demand ↓ → <strong>Price ↓, Quantity ↓.</strong></>}
        {sShift > 0 && dShift === 0 && <>Supply ↓ (costs up) → <strong>Price ↑, Quantity ↓.</strong></>}
        {sShift < 0 && dShift === 0 && <>Supply ↑ (costs down) → <strong>Price ↓, Quantity ↑.</strong></>}
        {dShift > 0 && sShift > 0 && <>D↑ + S↓ → Price definitely ↑, quantity ambiguous.</>}
        {dShift < 0 && sShift < 0 && <>D↓ + S↑ → Price definitely ↓, quantity ambiguous.</>}
        {dShift > 0 && sShift < 0 && <>D↑ + S↑ → Quantity definitely ↑, price ambiguous.</>}
        {dShift < 0 && sShift > 0 && <>D↓ + S↓ → Quantity definitely ↓, price ambiguous.</>}
      </div>
    </div>
  );
}

function ElasticityGraph() {
  const [t, setT] = useState("normal");
  const cfgs = {
    normal: { d: 1, s: 0.8, l: "Moderate" }, inelasticD: { d: 3, s: 0.8, l: "Inelastic Demand" },
    elasticD: { d: 0.3, s: 0.8, l: "Elastic Demand" }, inelasticS: { d: 1, s: 3, l: "Inelastic Supply" },
    elasticS: { d: 1, s: 0.3, l: "Elastic Supply" },
  };
  const c = cfgs[t];
  const data = [];
  for (let q = 0; q <= 100; q += 2) {
    const pD = (50 + 50 * c.d) - c.d * q, pS = (50 - 50 * c.s) + c.s * q;
    data.push({ q, demand: pD >= 0 && pD <= 120 ? Math.round(pD * 10) / 10 : null, supply: pS >= 0 && pS <= 120 ? Math.round(pS * 10) / 10 : null });
  }
  return (
    <div style={{ margin: "28px 0" }}>
      <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap", alignItems: "center" }}>
        {Object.entries(cfgs).map(([k, v]) => (
          <button key={k} onClick={() => setT(k)} style={{
            padding: "10px 16px", borderRadius: 10, fontSize: 18, fontFamily: F.body, cursor: "pointer",
            ...glassPanel, background: t === k ? C.accentDim : C.glass, borderColor: t === k ? C.accent + "44" : C.glassBorder,
            color: t === k ? C.accent : C.textMuted, fontWeight: t === k ? 500 : 300,
          }}>{v.l}</button>
        ))}
        <ResetButton disabled={t === "normal"} onClick={() => setT("normal")} />
      </div>
      <ResponsiveContainer width="100%" height={320}>
        <ComposedChart data={data} margin={{ top: 10, right: 20, bottom: 20, left: 20 }}>
          <CartesianGrid strokeDasharray="3 3" stroke={C.gridLine} />
          <XAxis dataKey="q" label={{ value: "Quantity", position: "bottom", fill: C.textMuted, fontSize: 18 }} tick={{ fill: C.textMuted, fontSize: 18 }} stroke={C.gridLine} />
          <YAxis domain={[0, 120]} label={{ value: "Price ($)", angle: -90, position: "insideLeft", fill: C.textMuted, fontSize: 18 }} tick={{ fill: C.textMuted, fontSize: 18 }} stroke={C.gridLine} />
          <Line type="linear" dataKey="demand" stroke={C.demand} strokeWidth={2.5} dot={false} connectNulls={false} isAnimationActive={false} />
          <Line type="linear" dataKey="supply" stroke={C.supply} strokeWidth={2.5} dot={false} connectNulls={false} isAnimationActive={false} />
          <ReferenceDot x={50} y={50} r={6} fill={C.green} stroke={C.green} isAnimationActive={false} />
        </ComposedChart>
      </ResponsiveContainer>
      <div style={{ ...glassCard, fontSize: 22, lineHeight: 1.7, color: C.text, marginTop: 10 }}>
        {t === "normal" && <>Moderate slopes on both curves.</>}
        {t === "inelasticD" && <>Steep demand = inelastic. Buyers barely respond to price changes. From Ch. 6/8: <strong>buyers bear most of any tax.</strong></>}
        {t === "elasticD" && <>Flat demand = elastic. Small price increase → buyers flee. Taxes on elastic goods create <strong>large DWL.</strong></>}
        {t === "inelasticS" && <>Steep supply = inelastic. Sellers can't adjust output. <strong>Sellers bear most of any tax.</strong></>}
        {t === "elasticS" && <>Flat supply = elastic. Easy to scale production. Relates to Ch. 13: flat <strong>marginal cost</strong>.</>}
      </div>
    </div>
  );
}

// ─── PPF GRAPH (Ch. 1-3) ─────────────────────────────────────────────

function PPFGraph() {
  const [techGrowth, setTechGrowth] = useState(0);
  const [pointMode, setPointMode] = useState("efficient"); // efficient, inefficient, unattainable

  const scale = 1 + techGrowth / 100;
  const data = [];
  for (let x = 0; x <= 100; x += 2) {
    const maxY = scale * Math.sqrt(10000 - x * x);
    data.push({ x, frontier: Math.round(maxY * 10) / 10 });
  }

  const points = {
    efficient: { x: 60, y: Math.round(scale * Math.sqrt(10000 - 3600) * 10) / 10, label: "On frontier (efficient)", color: C.green },
    inefficient: { x: 40, y: 30, label: "Inside (inefficient — wasted resources)", color: C.yellow },
    unattainable: { x: 70, y: 85 * scale, label: "Outside (unattainable with current resources)", color: C.red },
  };
  const pt = points[pointMode];

  return (
    <div style={{ margin: "28px 0" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 10, flexWrap: "wrap" }}>
        <label style={{ fontSize: 20, color: C.textMuted, minWidth: 220 }}>Technology/Growth: <span style={{ color: C.accent, fontWeight: 200 }}>{techGrowth > 0 ? "+" : ""}{techGrowth}%</span></label>
        <input type="range" min={0} max={50} step={5} value={techGrowth} onChange={e => setTechGrowth(Number(e.target.value))} style={{ flex: 1, minWidth: 100, accentColor: C.accent }} />
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap", alignItems: "center" }}>
        {Object.entries(points).map(([k, v]) => (
          <button key={k} onClick={() => setPointMode(k)} style={{
            padding: "10px 18px", borderRadius: 10, fontSize: 20, fontFamily: F.body, cursor: "pointer",
            ...glassPanel, background: pointMode === k ? `${v.color}18` : C.glass,
            borderColor: pointMode === k ? v.color + "44" : C.glassBorder,
            color: pointMode === k ? v.color : C.textMuted, fontWeight: pointMode === k ? 200 : 100,
          }}>{k === "efficient" ? "Efficient" : k === "inefficient" ? "Inefficient" : "Unattainable"}</button>
        ))}
        <ResetButton disabled={pointMode === "efficient" && techGrowth === 0} onClick={() => { setPointMode("efficient"); setTechGrowth(0); }} />
      </div>
      <ResponsiveContainer width="100%" height={360}>
        <ComposedChart data={data} margin={{ top: 10, right: 20, bottom: 20, left: 20 }}>
          <CartesianGrid strokeDasharray="3 3" stroke={C.gridLine} />
          <XAxis dataKey="x" label={{ value: "Good A", position: "bottom", fill: C.textMuted, fontSize: 18 }} tick={{ fill: C.textMuted, fontSize: 18 }} stroke={C.gridLine} />
          <YAxis domain={[0, 160]} label={{ value: "Good B", angle: -90, position: "insideLeft", fill: C.textMuted, fontSize: 18 }} tick={{ fill: C.textMuted, fontSize: 18 }} stroke={C.gridLine} />
          {techGrowth > 0 && <Line type="monotone" dataKey="frontier" stroke={C.accent} strokeWidth={1} dot={false} isAnimationActive={false} strokeOpacity={0.2} data={Array.from({length: 51}, (_, i) => ({ x: i*2, frontier: Math.round(Math.sqrt(10000 - (i*2)*(i*2)) * 10) / 10 }))} />}
          <Line type="monotone" dataKey="frontier" stroke={C.accent} strokeWidth={2.5} dot={false} isAnimationActive={false} />
          <ReferenceDot x={pt.x} y={pt.y} r={8} fill={pt.color} stroke={pt.color} isAnimationActive={false} />
        </ComposedChart>
      </ResponsiveContainer>
      <div style={{ ...glassCard, fontSize: 22, lineHeight: 1.7, color: C.text, marginTop: 10 }}>
        <span style={{ color: pt.color }}>{pt.label}.</span>
        {pointMode === "efficient" && <> The slope of the frontier at this point shows the opportunity cost of Good A in terms of Good B. The frontier bows outward because opportunity costs increase — resources aren't equally suited to both goods.</>}
        {pointMode === "inefficient" && <> This economy is wasting resources or has unemployment. It could produce more of both goods by moving to the frontier.</>}
        {pointMode === "unattainable" && <> This combination requires more resources or better technology than currently available. Economic growth (slider above) shifts the frontier outward, making previously impossible points reachable.</>}
        {techGrowth > 0 && <> The faded inner curve shows the original frontier. Growth of {techGrowth}% expanded possibilities outward.</>}
      </div>
    </div>
  );
}

// ─── TOTAL REVENUE GRAPH (Ch. 5) ─────────────────────────────────────

function TotalRevenueGraph() {
  const [elasticity, setElasticity] = useState(1.0);

  // Demand: P = 100 - slope*Q, where slope controls elasticity
  // At midpoint (Q=50, P=50), Ed = (1/slope)*(P/Q) = 1/slope
  // So slope = 1/Ed
  const slope = 1 / elasticity;
  const data = [];
  for (let q = 1; q <= Math.min(99, Math.floor(100 / slope)); q += 1) {
    const p = 100 - slope * q;
    if (p < 0) break;
    const tr = p * q;
    data.push({ q, price: Math.round(p * 10) / 10, tr: Math.round(tr) });
  }

  const maxTR = data.reduce((max, d) => d.tr > max.tr ? d : max, data[0]);

  return (
    <div style={{ margin: "28px 0" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>
        <label style={{ fontSize: 20, color: C.textMuted, minWidth: 220 }}>Demand elasticity: <span style={{ color: C.demand, fontWeight: 200 }}>{elasticity.toFixed(1)}</span> <span style={{ fontSize: 18, opacity: 0.7 }}>({elasticity > 1 ? "elastic" : elasticity < 1 ? "inelastic" : "unit elastic"})</span></label>
        <input type="range" min={0.2} max={3.0} step={0.1} value={elasticity} onChange={e => setElasticity(Number(e.target.value))} style={{ flex: 1, minWidth: 100, accentColor: C.demand }} />
        <ResetButton disabled={elasticity === 1.0} onClick={() => setElasticity(1.0)} />
      </div>
      <ResponsiveContainer width="100%" height={340}>
        <ComposedChart data={data} margin={{ top: 10, right: 20, bottom: 20, left: 20 }}>
          <CartesianGrid strokeDasharray="3 3" stroke={C.gridLine} />
          <XAxis dataKey="q" label={{ value: "Quantity", position: "bottom", fill: C.textMuted, fontSize: 18 }} tick={{ fill: C.textMuted, fontSize: 18 }} stroke={C.gridLine} />
          <YAxis yAxisId="tr" label={{ value: "Total Revenue ($)", angle: -90, position: "insideLeft", fill: C.green, fontSize: 18 }} tick={{ fill: C.textMuted, fontSize: 18 }} stroke={C.gridLine} />
          <RTooltip contentStyle={{ ...glassPanel, background: "rgba(15,15,30,0.9)", fontSize: 18, fontWeight: 100 }} />
          <Line yAxisId="tr" type="monotone" dataKey="tr" stroke={C.green} strokeWidth={2.5} dot={false} isAnimationActive={false} name="Total Revenue" />
          {maxTR && <ReferenceDot yAxisId="tr" x={maxTR.q} y={maxTR.tr} r={6} fill={C.yellow} stroke={C.yellow} isAnimationActive={false} />}
        </ComposedChart>
      </ResponsiveContainer>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 8 }}>
        <div style={{ ...glassCard, textAlign: "center" }}>
          <div style={{ fontSize: 18, color: C.textMuted }}>Max Revenue</div>
          <div style={{ fontSize: 24, fontWeight: 200, color: C.green, fontFamily: F.mono }}>${maxTR ? maxTR.tr.toLocaleString() : 0}</div>
        </div>
        <div style={{ ...glassCard, textAlign: "center" }}>
          <div style={{ fontSize: 18, color: C.textMuted }}>At Quantity</div>
          <div style={{ fontSize: 24, fontWeight: 200, color: C.text, fontFamily: F.mono }}>{maxTR ? maxTR.q : 0}</div>
        </div>
      </div>
      <div style={{ ...glassCard, fontSize: 22, lineHeight: 1.7, color: C.text, marginTop: 10 }}>
        {elasticity > 1 && <>With elastic demand, revenue peaks at a lower price / higher quantity. Raising price loses too many buyers — the quantity drop overwhelms the price increase. This is why firms in competitive markets can't raise prices.</>}
        {elasticity < 1 && <>With inelastic demand, revenue peaks at a higher price / lower quantity. Buyers barely leave when price rises, so higher price means more revenue. This is why monopolists and governments tax inelastic goods.</>}
        {elasticity === 1.0 && <>With unit-elastic demand, the TR curve is symmetric. Revenue is maximized at the midpoint of the demand curve. Any price change in either direction reduces revenue equally.</>}
      </div>
    </div>
  );
}

// ─── EXTERNALITY GRAPH (Ch. 10) ──────────────────────────────────────

function ExternalityGraph() {
  const [extType, setExtType] = useState("negative");
  const [extSize, setExtSize] = useState(20);
  const containerRef = useRef(null);
  const [plotArea, setPlotArea] = useState(null);

  const data = [];
  for (let q = 0; q <= 100; q += 2) {
    const demand = 100 - q;
    const supply = 10 + 0.8 * q;
    const socialCost = extType === "negative" ? supply + extSize : supply;
    const socialBenefit = extType === "positive" ? demand + extSize : demand;
    data.push({
      q, demand: Math.round(demand * 10) / 10, supply: Math.round(supply * 10) / 10,
      social: Math.round((extType === "negative" ? socialCost : socialBenefit) * 10) / 10,
    });
  }

  const mktQ = 50, mktP = 50;
  let optQ, optP;
  if (extType === "negative") {
    optQ = Math.max(0, (90 - extSize) / 1.8);
    optP = 100 - optQ;
  } else {
    optQ = Math.min(100, (90 + extSize) / 1.8);
    optP = 10 + 0.8 * optQ;
  }

  const measurePlot = () => {
    if (!containerRef.current) return;
    const grid = containerRef.current.querySelector(".recharts-cartesian-grid-bg") || containerRef.current.querySelector(".recharts-cartesian-grid rect");
    const svg = containerRef.current.querySelector("svg.recharts-surface") || containerRef.current.querySelector("svg");
    if (!grid || !svg) return;
    const gr = grid.getBoundingClientRect(), sr = svg.getBoundingClientRect();
    setPlotArea({ left: gr.left - sr.left, top: gr.top - sr.top, width: gr.width, height: gr.height });
  };
  useEffect(() => { const t = setTimeout(measurePlot, 150); return () => clearTimeout(t); }, [extType, extSize]);
  useEffect(() => { const h = () => setTimeout(measurePlot, 150); window.addEventListener("resize", h); return () => window.removeEventListener("resize", h); }, []);

  const toX = (q) => plotArea ? plotArea.left + (q / 100) * plotArea.width : 0;
  const toY = (p) => plotArea ? plotArea.top + (1 - p / 140) * plotArea.height : 0;

  return (
    <div style={{ margin: "28px 0" }}>
      <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap", alignItems: "center" }}>
        {[{ k: "negative", l: "Negative (pollution)", c: C.red }, { k: "positive", l: "Positive (education)", c: C.green }].map(({ k, l, c }) => (
          <button key={k} onClick={() => setExtType(k)} style={{
            padding: "10px 18px", borderRadius: 10, fontSize: 20, fontFamily: F.body, cursor: "pointer",
            ...glassPanel, background: extType === k ? `${c}18` : C.glass,
            borderColor: extType === k ? c + "44" : C.glassBorder,
            color: extType === k ? c : C.textMuted, fontWeight: extType === k ? 200 : 100,
          }}>{l}</button>
        ))}
        <ResetButton disabled={extType === "negative" && extSize === 20} onClick={() => { setExtType("negative"); setExtSize(20); }} />
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 10, flexWrap: "wrap" }}>
        <label style={{ fontSize: 20, color: C.textMuted, minWidth: 220 }}>Externality size: <span style={{ color: C.accent, fontWeight: 200 }}>${extSize}</span></label>
        <input type="range" min={5} max={40} step={5} value={extSize} onChange={e => setExtSize(Number(e.target.value))} style={{ flex: 1, minWidth: 100, accentColor: C.accent }} />
      </div>
      <div ref={containerRef} style={{ position: "relative" }}>
        {plotArea && (
          <svg style={{ position: "absolute", top: 0, left: 0, width: "100%", height: 360, pointerEvents: "none", zIndex: 5 }}>
            <circle cx={toX(mktQ)} cy={toY(mktP)} r={6} fill={C.yellow} />
            <circle cx={toX(optQ)} cy={toY(optP)} r={6} fill={C.green} stroke={C.green} strokeWidth={2} />
          </svg>
        )}
        <ResponsiveContainer width="100%" height={360}>
          <ComposedChart data={data} margin={{ top: 10, right: 20, bottom: 20, left: 20 }}>
            <CartesianGrid strokeDasharray="3 3" stroke={C.gridLine} fill="transparent" />
            <XAxis dataKey="q" label={{ value: "Quantity", position: "bottom", fill: C.textMuted, fontSize: 18 }} tick={{ fill: C.textMuted, fontSize: 18 }} stroke={C.gridLine} />
            <YAxis domain={[0, 140]} label={{ value: "Price ($)", angle: -90, position: "insideLeft", fill: C.textMuted, fontSize: 18 }} tick={{ fill: C.textMuted, fontSize: 18 }} stroke={C.gridLine} />
            <Line type="linear" dataKey="demand" stroke={C.demand} strokeWidth={2.5} dot={false} isAnimationActive={false} name="Demand (Private Benefit)" />
            <Line type="linear" dataKey="supply" stroke={C.supply} strokeWidth={2.5} dot={false} isAnimationActive={false} name="Supply (Private Cost)" />
            <Line type="linear" dataKey="social" stroke={extType === "negative" ? C.red : C.green} strokeWidth={2} dot={false} isAnimationActive={false} strokeDasharray="8 4" name={extType === "negative" ? "Social Cost" : "Social Benefit"} />
            <ReferenceLine x={mktQ} stroke={C.yellow} strokeDasharray="4 4"><Label value="Market Q" fill={C.yellow} fontSize={18} position="top" /></ReferenceLine>
            <ReferenceLine x={Math.round(optQ)} stroke={C.green} strokeDasharray="4 4"><Label value="Optimal Q" fill={C.green} fontSize={18} position="top" /></ReferenceLine>
          </ComposedChart>
        </ResponsiveContainer>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginTop: 8 }}>
        {[
          { label: "Market Q", value: mktQ, color: C.yellow },
          { label: "Optimal Q", value: Math.round(optQ), color: C.green },
          { label: extType === "negative" ? "Overproduction" : "Underproduction", value: Math.abs(Math.round(mktQ - optQ)), color: C.red },
        ].map(({ label, value, color }) => (
          <div key={label} style={{ ...glassCard, textAlign: "center" }}>
            <div style={{ fontSize: 18, color: C.textMuted }}>{label}</div>
            <div style={{ fontSize: 24, fontWeight: 200, color, fontFamily: F.mono }}>{value}</div>
          </div>
        ))}
      </div>
      <div style={{ ...glassCard, fontSize: 22, lineHeight: 1.7, color: C.text, marginTop: 10 }}>
        {extType === "negative" && <>The dashed <span style={{ color: C.red }}>social cost</span> curve lies above private supply by ${extSize} (the external cost). The market produces {mktQ} units, but the social optimum is {Math.round(optQ)} — the gap of {Math.round(mktQ - optQ)} units is overproduction. A Pigouvian tax of ${extSize} would shift private cost up to social cost, correcting the distortion.</>}
        {extType === "positive" && <>The dashed <span style={{ color: C.green }}>social benefit</span> curve lies above private demand by ${extSize} (the external benefit). The market produces {mktQ} units, but the social optimum is {Math.round(optQ)} — the gap of {Math.round(optQ - mktQ)} units is underproduction. A subsidy of ${extSize} would shift private benefit up to social benefit, correcting the distortion.</>}
      </div>
    </div>
  );
}

// ─── FIRM PROFIT GRAPH (Ch. 14) ──────────────────────────────────────

function FirmProfitGraph() {
  const [marketPrice, setMarketPrice] = useState(30);

  const data = [];
  for (let q = 1; q <= 30; q++) {
    const fc = 100, vc = 5 * q + 0.5 * q * q, tc = fc + vc;
    const mc = 5 + 0.5 * (2 * q - 1);
    const atc = tc / q;
    const avc = vc / q;
    data.push({ q, mc: Math.round(mc * 10) / 10, atc: Math.round(atc * 10) / 10, avc: Math.round(avc * 10) / 10, price: marketPrice });
  }

  // Firm produces where P = MC: marketPrice = 5 + q - 0.5 → q = marketPrice - 4.5
  const firmQ = Math.max(1, Math.min(30, Math.round(marketPrice - 4.5)));
  const firmATC = data[firmQ - 1] ? data[firmQ - 1].atc : 0;
  const firmAVC = data[firmQ - 1] ? data[firmQ - 1].avc : 0;
  const profit = Math.round((marketPrice - firmATC) * firmQ);
  const shouldShutdown = marketPrice < firmAVC;

  return (
    <div style={{ margin: "28px 0" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>
        <label style={{ fontSize: 20, color: C.textMuted, minWidth: 220 }}>Market price: <span style={{ color: C.accent, fontWeight: 200 }}>${marketPrice}</span></label>
        <input type="range" min={5} max={60} step={1} value={marketPrice} onChange={e => setMarketPrice(Number(e.target.value))} style={{ flex: 1, minWidth: 100, accentColor: C.accent }} />
        <ResetButton disabled={marketPrice === 30} onClick={() => setMarketPrice(30)} />
      </div>
      <ResponsiveContainer width="100%" height={360}>
        <ComposedChart data={data} margin={{ top: 10, right: 20, bottom: 20, left: 20 }}>
          <CartesianGrid strokeDasharray="3 3" stroke={C.gridLine} />
          <XAxis dataKey="q" label={{ value: "Quantity", position: "bottom", fill: C.textMuted, fontSize: 18 }} tick={{ fill: C.textMuted, fontSize: 18 }} stroke={C.gridLine} />
          <YAxis domain={[0, 70]} label={{ value: "$ per unit", angle: -90, position: "insideLeft", fill: C.textMuted, fontSize: 18 }} tick={{ fill: C.textMuted, fontSize: 18 }} stroke={C.gridLine} />
          <RTooltip contentStyle={{ ...glassPanel, background: "rgba(15,15,30,0.9)", fontSize: 18, fontWeight: 100 }} />
          <Line type="monotone" dataKey="mc" stroke={C.mc} strokeWidth={2.5} dot={false} isAnimationActive={false} name="MC" />
          <Line type="monotone" dataKey="atc" stroke={C.atc} strokeWidth={2} dot={false} isAnimationActive={false} name="ATC" />
          <Line type="monotone" dataKey="avc" stroke={C.purple} strokeWidth={1.5} dot={false} isAnimationActive={false} strokeDasharray="6 3" name="AVC" />
          <ReferenceLine y={marketPrice} stroke={C.green} strokeWidth={2}>
            <Label value={`P = MR = $${marketPrice}`} fill={C.green} fontSize={18} position="right" />
          </ReferenceLine>
          {!shouldShutdown && firmQ > 0 && firmQ <= 30 && (
            <ReferenceLine x={firmQ} stroke={C.textMuted} strokeDasharray="4 4">
              <Label value={`Q*=${firmQ}`} fill={C.textMuted} fontSize={18} position="top" />
            </ReferenceLine>
          )}
        </ComposedChart>
      </ResponsiveContainer>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(110px, 1fr))", gap: 8, marginTop: 8 }}>
        {[
          { label: "Output", value: shouldShutdown ? "0 (shut down)" : firmQ, color: C.text },
          { label: "ATC at Q*", value: shouldShutdown ? "—" : `$${firmATC}`, color: C.atc },
          { label: "Profit", value: shouldShutdown ? "−$100 (FC only)" : `$${profit}`, color: profit > 0 ? C.green : profit < 0 ? C.red : C.text },
          { label: "Status", value: shouldShutdown ? "Shutdown" : profit > 0 ? "Profit" : profit < 0 ? "Loss (stay open)" : "Break even", color: shouldShutdown ? C.red : profit > 0 ? C.green : C.yellow },
        ].map(({ label, value, color }) => (
          <div key={label} style={{ ...glassCard, textAlign: "center" }}>
            <div style={{ fontSize: 18, color: C.textMuted }}>{label}</div>
            <div style={{ fontSize: 20, fontWeight: 200, color, fontFamily: F.mono }}>{value}</div>
          </div>
        ))}
      </div>
      <div style={{ ...glassCard, fontSize: 22, lineHeight: 1.7, color: C.text, marginTop: 10 }}>
        {shouldShutdown && <>Price is below AVC — the firm cannot even cover its variable costs. It shuts down and only loses fixed costs ($100). Producing would lose even more.</>}
        {!shouldShutdown && profit > 0 && <>Price exceeds ATC at the profit-maximizing quantity. The firm earns economic profit of ${profit}. In the long run (Ch. 14), this attracts entry, pushing price down toward min ATC.</>}
        {!shouldShutdown && profit < 0 && <>Price is above AVC but below ATC. The firm stays open (revenue covers variable costs and some fixed costs), but takes a loss of ${Math.abs(profit)}. In the long run, firms exit until price rises to min ATC.</>}
        {!shouldShutdown && profit === 0 && <>Price equals ATC — zero economic profit. The firm covers all costs including opportunity costs. This is the long-run competitive equilibrium.</>}
      </div>
    </div>
  );
}

function PrisonersDilemmaWidget() {
  const [choiceA, setChoiceA] = useState(null);
  const [choiceB, setChoiceB] = useState(null);

  const payoffs = {
    "cooperate-cooperate": { a: 3, b: 3, label: "Both cooperate — good outcome for both" },
    "cooperate-defect": { a: 0, b: 5, label: "A cooperates, B defects — A gets exploited" },
    "defect-cooperate": { a: 5, b: 0, label: "A defects, B cooperates — B gets exploited" },
    "defect-defect": { a: 1, b: 1, label: "Both defect — Nash equilibrium, collectively worse" },
  };

  const key = choiceA && choiceB ? `${choiceA}-${choiceB}` : null;
  const result = key ? payoffs[key] : null;

  const cellStyle = (isSelected, highlight) => ({
    ...glassCard, textAlign: "center", padding: "16px",
    background: isSelected ? (highlight === "good" ? `${C.green}12` : highlight === "bad" ? `${C.red}12` : `${C.yellow}12`) : C.glass,
    border: `1px solid ${isSelected ? (highlight === "good" ? C.green + "44" : highlight === "bad" ? C.red + "44" : C.yellow + "44") : C.glassBorder}`,
    cursor: "pointer",
  });

  const getHighlight = (a, b) => {
    if (!key) return null;
    if (`${a}-${b}` !== key) return null;
    const p = payoffs[key];
    if (p.a === 3 && p.b === 3) return "good";
    if (p.a === 1 && p.b === 1) return "bad";
    return "mixed";
  };

  return (
    <div style={{ margin: "28px 0" }}>
      <p style={{ fontSize: 20, color: C.textMuted, marginBottom: 16 }}>Choose strategies for Firm A and Firm B:</p>
      <div style={{ display: "flex", gap: 12, marginBottom: 16, flexWrap: "wrap" }}>
        <div>
          <div style={{ fontSize: 18, color: C.demand, marginBottom: 8 }}>Firm A:</div>
          <div style={{ display: "flex", gap: 8 }}>
            {["cooperate", "defect"].map(c => (
              <button key={c} onClick={() => setChoiceA(c)} style={{
                padding: "10px 18px", borderRadius: 10, fontSize: 20, fontFamily: F.body, cursor: "pointer",
                ...glassPanel, background: choiceA === c ? `${C.demand}18` : C.glass,
                borderColor: choiceA === c ? C.demand + "44" : C.glassBorder,
                color: choiceA === c ? C.demand : C.textMuted, fontWeight: choiceA === c ? 200 : 100,
              }}>{c === "cooperate" ? "Cooperate" : "Defect"}</button>
            ))}
          </div>
        </div>
        <div>
          <div style={{ fontSize: 18, color: C.supply, marginBottom: 8 }}>Firm B:</div>
          <div style={{ display: "flex", gap: 8 }}>
            {["cooperate", "defect"].map(c => (
              <button key={c} onClick={() => setChoiceB(c)} style={{
                padding: "10px 18px", borderRadius: 10, fontSize: 20, fontFamily: F.body, cursor: "pointer",
                ...glassPanel, background: choiceB === c ? `${C.supply}18` : C.glass,
                borderColor: choiceB === c ? C.supply + "44" : C.glassBorder,
                color: choiceB === c ? C.supply : C.textMuted, fontWeight: choiceB === c ? 200 : 100,
              }}>{c === "cooperate" ? "Cooperate" : "Defect"}</button>
            ))}
          </div>
        </div>
        <div style={{ alignSelf: "flex-end" }}><ResetButton disabled={!choiceA && !choiceB} onClick={() => { setChoiceA(null); setChoiceB(null); }} /></div>
      </div>

      {/* Payoff matrix */}
      <div style={{ display: "grid", gridTemplateColumns: "auto 1fr 1fr", gap: 2, maxWidth: 500, marginBottom: 16 }}>
        <div style={{ ...glassCard, background: "transparent", border: "none" }} />
        <div style={{ ...glassCard, textAlign: "center", fontSize: 18, color: C.supply }}>B: Cooperate</div>
        <div style={{ ...glassCard, textAlign: "center", fontSize: 18, color: C.supply }}>B: Defect</div>

        <div style={{ ...glassCard, fontSize: 18, color: C.demand, display: "flex", alignItems: "center" }}>A: Cooperate</div>
        <div style={cellStyle(key === "cooperate-cooperate", getHighlight("cooperate", "cooperate"))} onClick={() => { setChoiceA("cooperate"); setChoiceB("cooperate"); }}>
          <div style={{ fontSize: 20, color: C.demand, fontFamily: F.mono }}>A: 3</div>
          <div style={{ fontSize: 20, color: C.supply, fontFamily: F.mono }}>B: 3</div>
        </div>
        <div style={cellStyle(key === "cooperate-defect", getHighlight("cooperate", "defect"))} onClick={() => { setChoiceA("cooperate"); setChoiceB("defect"); }}>
          <div style={{ fontSize: 20, color: C.demand, fontFamily: F.mono }}>A: 0</div>
          <div style={{ fontSize: 20, color: C.supply, fontFamily: F.mono }}>B: 5</div>
        </div>

        <div style={{ ...glassCard, fontSize: 18, color: C.demand, display: "flex", alignItems: "center" }}>A: Defect</div>
        <div style={cellStyle(key === "defect-cooperate", getHighlight("defect", "cooperate"))} onClick={() => { setChoiceA("defect"); setChoiceB("cooperate"); }}>
          <div style={{ fontSize: 20, color: C.demand, fontFamily: F.mono }}>A: 5</div>
          <div style={{ fontSize: 20, color: C.supply, fontFamily: F.mono }}>B: 0</div>
        </div>
        <div style={cellStyle(key === "defect-defect", getHighlight("defect", "defect"))} onClick={() => { setChoiceA("defect"); setChoiceB("defect"); }}>
          <div style={{ fontSize: 20, color: C.demand, fontFamily: F.mono }}>A: 1</div>
          <div style={{ fontSize: 20, color: C.supply, fontFamily: F.mono }}>B: 1</div>
        </div>
      </div>

      {result && (
        <div style={{ ...glassCard, fontSize: 22, lineHeight: 1.7, color: C.text }}>
          <span style={{ color: key === "cooperate-cooperate" ? C.green : key === "defect-defect" ? C.red : C.yellow }}>{result.label}.</span>
          {key === "defect-defect" && <> This is the Nash equilibrium — neither firm can improve by changing strategy alone. But both would be better off at (3, 3) if they could commit to cooperating. That is the dilemma.</>}
          {key === "cooperate-cooperate" && <> This is the best collective outcome — but it is unstable. Each firm can gain by unilaterally defecting (jumping to 5), which is why cooperation tends to break down.</>}
          {(key === "cooperate-defect" || key === "defect-cooperate") && <> The defector exploits the cooperator. This is why cooperating is risky — if the other side defects, you get the worst possible outcome. This fear drives both sides toward defection.</>}
        </div>
      )}
      {!result && (
        <div style={{ ...glassCard, fontSize: 22, lineHeight: 1.7, color: C.textMuted }}>
          Select strategies for both firms to see the payoffs, or click directly on a cell in the matrix.
        </div>
      )}
    </div>
  );
}

function ChapterFoundations() {
  return (<div>
    <SectionTitle>Ten Principles (Ch. 1)</SectionTitle>
    <p><strong>How people decide:</strong> (1) People face trade-offs. (2) The cost of something is what you give up — <T t="opportunity cost" />. (3) Rational people think at the <T t="marginal thinking">margin</T>. (4) People respond to incentives.</p>
    <p><strong>How people interact:</strong> (5) Trade benefits everyone via specialization. (6) Markets usually organize activity well (invisible hand). (7) Government can sometimes improve outcomes (market failures).</p>
    <p><strong>The economy:</strong> (8) Living standards depend on productivity. (9–10 are macro topics.)</p>
    <Intuition>Opportunity cost is the most powerful idea in economics. Every choice has a hidden price: what you didn't do instead.</Intuition>
    <DeepDive title="Why Marginal Thinking Matters">
      <p>You don't decide "should I eat?" — you decide "should I eat <em>one more bite</em>?" Compare the marginal benefit of that bite to its marginal cost (fullness, calories). This logic scales to firms (produce one more unit?), governments (spend one more dollar on defense?), and everything in between.</p>
      <p>Ignoring <T t="sunk cost">sunk costs</T> is the flip side: money already spent is irrelevant to marginal decisions. The movie ticket is paid for — stay or leave based on whether the <em>remaining</em> movie is worth your time.</p>
    </DeepDive>

    <SectionTitle>The PPF & Models (Ch. 2)</SectionTitle>
    <p>The <T t="production possibilities frontier">PPF</T> shows max combinations of two goods an economy can produce. Points on = efficient, inside = inefficient, outside = unattainable. It bows outward because of increasing opportunity costs. Economic growth shifts the PPF outward.</p>
    <p style={{ fontWeight: 200, color: C.heading, marginTop: 36 }}>Interactive: Production Possibilities Frontier</p>
    <PPFGraph />
    <p><strong>Positive statements</strong> describe how the world <em>is</em> (testable). <strong>Normative statements</strong> say how it <em>should be</em> (value judgments).</p>

    <SectionTitle>Comparative Advantage (Ch. 3)</SectionTitle>
    <p><T t="absolute advantage" /> = who produces more with the same resources. <T t="comparative advantage" /> = who produces at lower <T t="opportunity cost" />. Comparative advantage determines who should specialize.</p>
    <Formula>Opportunity cost of Good A = Good B given up / Good A gained</Formula>
    <p>Even if one party is better at <em>everything</em>, trade still benefits both — what matters is <em>relative</em> opportunity cost. Terms of trade must fall between the two parties' opportunity costs.</p>
    <Intuition>LeBron James might mow lawns faster than anyone, but his opportunity cost of mowing is enormous (lost basketball income). He should specialize in basketball. That's comparative advantage.</Intuition>
    <DeepDive title="Trade Beyond Two People">
      <p>The same logic applies to firms, regions, and countries. International trade (Ch. 9) is just comparative advantage at global scale. Each country specializes in goods where its opportunity cost is lowest, then trades. Total world output increases, and both sides can consume beyond their individual <T t="ppf">PPFs</T>.</p>
    </DeepDive>
  </div>);
}

function ChapterShocks() {
  return (<div>
    <SectionTitle>The Demand Curve</SectionTitle>
    <p>The demand curve shows the quantity buyers want at each price, holding all else constant. It slopes downward because of two reinforcing effects: as price rises, buyers switch to alternatives (<T t="substitution effect" />) and feel poorer (<T t="income effect" />).</p>
    <p>Each point on the demand curve represents a buyer's <T t="consumer surplus">willingness to pay</T> for that unit. The curve is also a marginal benefit curve — it tells you how much the next unit is worth to the market.</p>

    <SectionTitle>The Supply Curve</SectionTitle>
    <p>The supply curve shows the quantity sellers offer at each price, holding all else constant. It slopes upward because producing more costs more — <T t="marginal cost">MC</T> rises due to <T t="diminishing marginal returns" /> (Ch. 13). Higher prices are needed to justify the extra cost.</p>
    <p>Each point on the supply curve represents a seller's cost for that unit. The curve is also a marginal cost curve — it tells you how much the next unit costs the market to produce.</p>

    <SectionTitle>Equilibrium</SectionTitle>
    <p>The <T t="equilibrium" /> is where supply meets demand. At this price, quantity demanded equals quantity supplied — the market clears. No <T t="shortage" />, no <T t="surplus" />.</p>
    <p>If price is above equilibrium, sellers can't sell everything (surplus), so they undercut each other, pushing price down. If price is below, buyers can't get everything they want (shortage), so they bid against each other, pushing price up. The market self-corrects.</p>
    <Intuition>Equilibrium is the market's resting state. Any deviation triggers forces that push it back. This self-correction is what Adam Smith called the "invisible hand" (Ch. 1, Principle #6).</Intuition>

    <SectionTitle>Shifts vs. Movements</SectionTitle>
    <p>A movement along the curve happens when the good's own price changes — you slide to a different point on the same curve. A shift of the entire curve happens when something other than the good's own price changes.</p>
    <p>A shift is also called a <T t="shock" /> — an unexpected change in a factor that moves supply or demand. A <T t="demand shock" /> is any event that shifts the demand curve (a change in tastes, income, or related prices). A <T t="supply shock" /> is any event that shifts the supply curve (a change in input costs, technology, or regulation). The word "shock" emphasizes that these are external events hitting the market from outside, as opposed to movements caused by the market's own price mechanism.</p>
    <p>This distinction is the single most important concept in supply-demand analysis. Getting it wrong cascades into wrong conclusions about everything that follows.</p>

    <DeepDive title="Demand Shifters — Complete List">
      <p><strong>Income:</strong> For <em>normal goods</em>, higher income shifts demand right (people buy more). For <em>inferior goods</em>, higher income shifts demand left (people upgrade to better alternatives). Example: instant ramen is inferior — when income rises, people switch to fresh meals.</p>
      <p><strong>Prices of related goods:</strong> If a <em>substitute's</em> price rises, demand for your good rises (Coke gets expensive → buy Pepsi). If a <em>complement's</em> price rises, demand for your good falls (printers get expensive → fewer ink cartridges needed).</p>
      <p><strong>Tastes and preferences:</strong> A trend, advertisement, or health study can shift demand. A viral TikTok video shifts demand right; a food safety scandal shifts it left.</p>
      <p><strong>Expectations:</strong> If buyers expect the price to rise tomorrow, demand rises today (buy now before the increase). If they expect a recession, demand falls today.</p>
      <p><strong>Number of buyers:</strong> Population growth, immigration, or market expansion shifts demand right. A shrinking customer base shifts it left.</p>
    </DeepDive>

    <DeepDive title="Supply Shifters — Complete List">
      <p><strong>Input prices:</strong> Higher wages, raw material costs, or energy prices shift supply left (up). Lower input costs shift supply right (down).</p>
      <p><strong>Technology:</strong> Better tech reduces production costs → supply shifts right. This is the main driver of long-run economic growth.</p>
      <p><strong>Expectations:</strong> If sellers expect higher future prices, they may withhold supply today → left shift. If they expect falling prices, they sell now → right shift.</p>
      <p><strong>Number of sellers:</strong> Firms entering the market → supply right. Firms exiting → supply left. (This is the mechanism behind Ch. 14's long-run competitive equilibrium.)</p>
      <p><strong>Government policy:</strong> Regulations increase costs → left. Subsidies decrease costs → right. Environmental laws, safety requirements, licensing rules all shift supply.</p>
      <p><strong>Natural events:</strong> Drought, hurricanes, pandemics → supply shifts left for affected goods.</p>
    </DeepDive>

    <SectionTitle>Predicting Outcomes</SectionTitle>
    <p>When only one curve shifts, the result is unambiguous:</p>
    <Formula>Demand ↑ → P↑, Q↑ &nbsp;|&nbsp; Demand ↓ → P↓, Q↓</Formula>
    <Formula>Supply ↑ → P↓, Q↑ &nbsp;|&nbsp; Supply ↓ → P↑, Q↓</Formula>
    <p>When both curves shift simultaneously, one variable is predictable and the other is ambiguous — its direction depends on which shift is larger. For example, if demand increases and supply decreases, price definitely rises (both push it up), but quantity could go either way.</p>

    <DeepDive title="The Four Double-Shift Scenarios">
      <p><strong>D↑ and S↑:</strong> Q definitely ↑ (both push it up). P is ambiguous (D pushes up, S pushes down).</p>
      <p><strong>D↓ and S↓:</strong> Q definitely ↓. P is ambiguous.</p>
      <p><strong>D↑ and S↓:</strong> P definitely ↑ (both push it up). Q is ambiguous.</p>
      <p><strong>D↓ and S↑:</strong> P definitely ↓. Q is ambiguous.</p>
      <p>The pattern: the variable where both forces agree is predictable. The variable where forces conflict is ambiguous. This is a very common exam question.</p>
    </DeepDive>

    <SectionTitle>Applying the Model: Real-World Examples</SectionTitle>
    <p>Oil prices spike after a Middle East conflict → supply shock (supply shifts left) → P↑, Q↓. This explains gas price surges.</p>
    <p>A new technology makes solar panels cheap → supply shifts right → P↓, Q↑. This explains why solar adoption accelerated.</p>
    <p>COVID-19 hit both curves: demand shifted left for travel and restaurants (people stayed home), and supply shifted left too (workers got sick, supply chains broke). The net effect on price and quantity depended on which shift dominated in each specific market.</p>
    <Intuition>Every newspaper headline about rising or falling prices can be analyzed with this framework. Identify which curve shifted, which direction, and you can explain the outcome. This is the workhorse model of economics.</Intuition>

    <p style={{ fontWeight: 200, color: C.heading, marginTop: 36 }}>Interactive: Market Shocks Simulator</p>
    <p style={{ color: C.textMuted, fontSize: 20 }}>Try single shifts first, then combine them to see which variable becomes ambiguous.</p>
    <MarketShocksGraph />
  </div>);
}

function Chapter5() {
  return (<div>
    <SectionTitle>Price Elasticity of Demand</SectionTitle>
    <p><T t="price elasticity of demand" /> measures how much Qd responds to price changes.</p>
    <Formula>Ed = % Change in Qd / % Change in Price &nbsp;(use midpoint method)</Formula>
    <p>Ed &gt; 1 = <T t="elastic" />, Ed &lt; 1 = <T t="inelastic" />, Ed = 1 = <T t="unit elastic" />.</p>
    <p><strong>Determinants:</strong> Availability of substitutes, necessity vs. luxury, market definition (narrow = more elastic), time horizon (long run = more elastic), share of budget.</p>
    <Intuition>Elasticity answers: "How trapped are buyers?" More trapped → more inelastic.</Intuition>

    <DeepDive title="Elasticity & Total Revenue — The Critical Link">
      <p><T t="total revenue" /> = P × Q. The relationship with elasticity:</p>
      <p>— <strong>Elastic:</strong> Price ↑ → Revenue ↓ (Q drops too much).</p>
      <p>— <strong>Inelastic:</strong> Price ↑ → Revenue ↑ (Q barely drops).</p>
      <p>— <strong>Unit elastic:</strong> Revenue unchanged.</p>
      <p>This is why governments tax inelastic goods — the base doesn't shrink much, maximizing revenue with minimal <T t="deadweight loss">DWL</T> (Ch. 6/8).</p>
    </DeepDive>

    <SectionTitle>Other Elasticities</SectionTitle>
    <p><T t="price elasticity of supply" />: same idea for sellers. Determined by production flexibility and time horizon. Directly related to how quickly <T t="mc">MC</T> rises (Ch. 13).</p>
    <p><T t="income elasticity of demand" />: positive = normal good (Ei &gt; 1 = luxury), negative = inferior good.</p>
    <p><T t="cross-price elasticity" />: positive = substitutes, negative = complements.</p>

    <p style={{ fontWeight: 200, color: C.heading, marginTop: 36 }}>Interactive: Visualizing Elasticity</p>
    <ElasticityGraph />

    <p style={{ fontWeight: 200, color: C.heading, marginTop: 36 }}>Interactive: Elasticity & Total Revenue</p>
    <p style={{ color: C.textMuted, fontSize: 20 }}>Adjust demand elasticity and watch how the total revenue curve changes shape. Notice where revenue peaks.</p>
    <TotalRevenueGraph />
