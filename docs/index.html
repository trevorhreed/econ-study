function Chapter6_8() {
  return (<div>
    <SectionTitle>Price Controls</SectionTitle>
    <p>A <T t="price ceiling" /> is a legal max price. Binding when set below <T t="equilibrium" /> → <T t="shortage" /> → black markets, queues, quality degradation.</p>
    <p>A <T t="price floor" /> is a legal min price. Binding when set above equilibrium → <T t="surplus" /> → wasted output. Minimum wage is a price floor in the labor market.</p>
    <p style={{ fontWeight: 200, color: C.heading, marginTop: 36 }}>Interactive: Price Controls</p>
    <SupplyDemandGraph />

    <SectionTitle>Taxation</SectionTitle>
    <p>A tax drives a <T t="tax wedge" /> between buyer and seller prices, reducing quantity traded and creating <T t="deadweight loss" />.</p>
    <p><strong>Key insight:</strong> <T t="statutory incidence">Who writes the check</T> doesn't matter — <T t="economic incidence">who bears the burden</T> depends on relative <T t="elasticity" /> (Ch. 5). The more <T t="inelastic" /> side bears more.</p>
    <Intuition>Tax a product and the burden falls on whoever is more trapped. Inelastic buyers can't leave; inelastic sellers can't exit. The trapped party pays.</Intuition>

    <DeepDive title="The Laffer Curve & Optimal Taxation">
      <p>The <T t="laffer curve" />: at tax rate 0 → revenue = 0. At 100% → nobody trades → revenue = 0. Revenue is maximized somewhere in between. DWL grows with the square of the tax rate — doubling the tax quadruples DWL. This connects to Ch. 12's tax design principles.</p>
    </DeepDive>

    <p style={{ fontWeight: 200, color: C.heading, marginTop: 36 }}>Interactive: Tax Wedge Simulator</p>
    <TaxWedgeGraph />
  </div>);
}

function Chapter7() {
  return (<div>
    <SectionTitle>Consumer Surplus</SectionTitle>
    <p><T t="consumer surplus" /> is the difference between what buyers are willing to pay and what they actually pay. On a graph, it's the area below the demand curve and above the market price. It measures the net benefit buyers receive from participating in the market.</p>
    <p>When price falls, consumer surplus rises (existing buyers get a better deal, and new buyers enter). When price rises, consumer surplus shrinks.</p>

    <SectionTitle>Producer Surplus</SectionTitle>
    <p><T t="producer surplus" /> is the difference between the market price and sellers' cost. On a graph, it's the area above the supply curve and below the price. It measures the net benefit sellers receive — their revenue minus their costs.</p>
    <p>When price rises, producer surplus increases. When price falls, it shrinks. This is why sellers lobby for higher prices and buyers lobby for lower ones.</p>

    <SectionTitle>Total Surplus & Efficiency</SectionTitle>
    <p><T t="total surplus" /> = CS + PS. It measures the total net benefit to society from trade in a market. At <T t="equilibrium" />, total surplus is maximized — this is <T t="allocative efficiency" />.</p>
    <p>Efficiency means there's no way to make someone better off without making someone else worse off (<T t="pareto efficiency" />). Free markets achieve this because the price mechanism ensures that every unit where buyer value exceeds seller cost gets traded, and no unit where seller cost exceeds buyer value does.</p>
    <Intuition>The invisible hand (Ch. 1, Principle #6) works because prices guide resources to their highest-valued uses. Equilibrium maximizes total surplus — this chapter formalizes that claim.</Intuition>

    <DeepDive title="Why Interventions Reduce Surplus">
      <p>Any intervention that moves quantity away from equilibrium creates <T t="deadweight loss" /> — mutually beneficial trades that don't happen. Taxes (Ch. 6/8) reduce Q and create DWL triangles. Price ceilings (Ch. 6) cause shortages where willing-to-pay buyers can't find willing-to-sell sellers. Monopoly (Ch. 15) restricts output below the competitive level. Tariffs (Ch. 9) do the same at borders.</p>
      <p>The CS/PS framework is the universal evaluation tool for all these policies. Whenever you need to judge a policy's impact, draw the surplus areas before and after.</p>
    </DeepDive>

    <DeepDive title="Limitations of the Surplus Framework">
      <p>Total surplus doesn't account for <T t="externality">externalities</T> (Ch. 10), <T t="public good">public goods</T> (Ch. 11), or distributional concerns (Ch. 20). A policy that increases total surplus but concentrates gains on the rich might not be desirable. Efficiency is a goal, but it's not the only goal — equity matters too (Ch. 1, Principle #1: trade-offs).</p>
    </DeepDive>

    <p style={{ fontWeight: 200, color: C.heading, marginTop: 36 }}>Interactive: Consumer & Producer Surplus</p>
    <EfficiencyGraph />
  </div>);
}

function Chapter9() {
  return (<div>
    <SectionTitle>The Determinants of Trade</SectionTitle>
    <p>A country's trade position depends on comparing its domestic price (without trade) to the <T t="world price" />. If the domestic price is lower, the country can produce the good cheaply relative to the world — it has a <T t="comparative advantage" /> (Ch. 3) and becomes an exporter. If the domestic price is higher, it imports.</p>
    <p>This is the same comparative advantage logic from Ch. 3, now applied at the national level. The domestic price reflects the country's opportunity cost of production.</p>

    <SectionTitle>Winners and Losers from Trade</SectionTitle>
    <p>Use the <T t="consumer surplus">CS</T> and <T t="producer surplus">PS</T> framework from Ch. 7 to evaluate welfare:</p>
    <p>When a country exports, domestic price rises to the world price. Producers gain more PS, consumers lose CS, but the gain exceeds the loss — total surplus rises. When a country imports, domestic price falls. Consumers gain, producers lose, but again total surplus rises.</p>
    <Intuition>Trade expands the total pie but redistributes the slices. The losers are concentrated (domestic producers hurt by imports) while the gains are diffuse (all consumers pay lower prices). That is why trade generates political opposition even though it is net beneficial.</Intuition>

    <SectionTitle>Tariffs</SectionTitle>
    <p>A <T t="tariff" /> is a tax on imports. It raises the domestic price above the world price, increasing domestic production, decreasing consumption, and reducing imports. Domestic producers gain, consumers lose, and the government collects revenue.</p>
    <p>The net effect is <T t="deadweight loss" /> — two triangles, one from inefficient overproduction and one from lost consumption. This is the same Ch. 6/8 tax logic, applied at the border.</p>
    <p>An <T t="import quota" /> limits import quantity. Effects resemble a tariff, but the price premium goes to whoever holds the import licenses rather than the government.</p>

    <DeepDive title="Arguments For and Against Protection">
      <p>National security (some validity for defense industries), the <T t="infant industry" /> argument (hard to pick winners, "temporary" becomes permanent), unfair competition (if foreigners sell cheap, our consumers benefit), and the jobs argument (trade reallocates jobs across industries rather than destroying them net).</p>
      <p>Economists nearly unanimously agree that free trade increases total welfare. The political challenge is compensating the losers — those whose industries shrink from import competition.</p>
    </DeepDive>
  </div>);
}

function Chapter10() {
  return (<div>
    <SectionTitle>What Are Externalities?</SectionTitle>
    <p>An <T t="externality" /> is a cost or benefit that falls on someone who is not a buyer or seller in the transaction — a third party who never agreed to participate.</p>
    <p>A <T t="negative externality" /> imposes costs on third parties. A factory pollutes a river, harming downstream residents. The factory's private cost is less than the <T t="social cost" /> (private cost + external cost), so the market overproduces relative to the socially optimal quantity.</p>
    <p>A <T t="positive externality" /> confers benefits on third parties. Getting vaccinated protects you and everyone around you. The private benefit is less than the <T t="social benefit" /> (private benefit + external benefit), so the market underproduces.</p>
    <Intuition>Externalities are why Ch. 1 Principle #7 says governments "can sometimes improve market outcomes." The invisible hand works when all costs and benefits are captured in market prices. Externalities break that assumption.</Intuition>

    <SectionTitle>Why Markets Get It Wrong</SectionTitle>
    <p>Recall from Ch. 7: free markets maximize <T t="total surplus" /> when supply reflects all costs and demand reflects all benefits. Externalities create a gap between private and social cost (or benefit), pushing the market away from the efficient outcome. The distance between market quantity and optimal quantity is pure <T t="deadweight loss" />.</p>
    <Formula>Negative ext: Social Cost = Private Cost + External Cost → overproduction</Formula>
    <Formula>Positive ext: Social Benefit = Private Benefit + External Benefit → underproduction</Formula>

    <SectionTitle>Solutions</SectionTitle>
    <p><T t="pigouvian tax">Pigouvian taxes</T> make the private cost equal to the social cost, "internalizing" the externality. Unlike normal taxes (Ch. 6/8) that create DWL, a Pigouvian tax reduces DWL by correcting a distortion that was already there.</p>
    <p>Regulation (command-and-control) directly mandates behavior — emission limits, required vaccinations. Simple but inflexible. Tradable permits cap total pollution and let firms trade, combining the certainty of regulation with market flexibility.</p>

    <DeepDive title="Private Solutions: The Coase Theorem">
      <p>The <T t="coase theorem" />: with clear property rights and low transaction costs, private parties can negotiate to the efficient outcome regardless of who initially holds the rights. A factory polluting a fishery can negotiate compensation either way.</p>
      <p>The catch: transaction costs are often high (many affected parties, hard to organize), property rights are unclear, and <T t="free rider">free-rider</T> problems arise when externalities affect many people. Coase works in theory but often not in practice, which is why government solutions are needed.</p>
    </DeepDive>

    <p style={{ fontWeight: 200, color: C.heading, marginTop: 36 }}>Interactive: Externality Simulator</p>
    <p style={{ color: C.textMuted, fontSize: 20 }}>See how externalities cause markets to over- or underproduce, and how the gap between market and optimal quantity changes with externality size.</p>
    <ExternalityGraph />
  </div>);
}

function Chapter11() {
  return (<div>
    <SectionTitle>Classifying Goods</SectionTitle>
    <p>All goods can be classified along two dimensions: <T t="excludable" /> (can you prevent non-payers from using it?) and <T t="rivalrous" /> (does one person's consumption reduce what's available for others?).</p>
    <Formula>Rival + Excludable = Private Good (ice cream, clothing)</Formula>
    <Formula>Rival + Non-excludable = Common Resource (fish in the sea)</Formula>
    <Formula>Non-rival + Excludable = Club Good (cable TV, toll roads)</Formula>
    <Formula>Non-rival + Non-excludable = Public Good (national defense)</Formula>
    <p>Private goods work fine in markets because sellers can charge and supply is limited. The problems arise in the other three quadrants.</p>

    <SectionTitle>Public Goods</SectionTitle>
    <p>Because <T t="public good">public goods</T> are non-excludable, people can enjoy them without paying — the <T t="free rider" /> problem. Private markets undersupply public goods because no individual has enough incentive to pay the full cost. This is the same logic as <T t="positive externality">positive externalities</T> (Ch. 10) — the benefit to society exceeds the private benefit to any one buyer.</p>
    <p>The solution is government provision funded by taxes. The hard question is how much to provide, since people have no incentive to reveal their true <T t="consumer surplus">willingness to pay</T>.</p>

    <SectionTitle>Common Resources</SectionTitle>
    <p><T t="common resource">Common resources</T> are rivalrous but non-excludable. Since nobody owns them, nobody has the incentive to conserve them. The <T t="tragedy of the commons" />: each user benefits from taking more, but the cost of depletion is shared by everyone. Individual incentives lead to overuse and potential destruction.</p>
    <p>This is a <T t="negative externality">negative externality</T> problem (Ch. 10) — each user's consumption imposes costs on others. Solutions: regulation (fishing quotas, hunting seasons), privatization (assign property rights so someone has an incentive to manage sustainably), or tradable permits.</p>
    <Intuition>Nobody washes a rental car. When something belongs to everyone, it belongs to no one — and nobody takes care of it. This applies to ocean fisheries, clean air, congested roads, and groundwater aquifers.</Intuition>

    <DeepDive title="Why This Classification Matters">
      <p>The 2x2 matrix connects to every market failure in the course. Public goods connect to Ch. 10 (positive externalities) and Ch. 12 (why we need taxes). Common resources connect to Ch. 10 (negative externalities) and Ch. 17 (the prisoner's dilemma — each user defects by overusing). Understanding which quadrant a good falls into immediately tells you what kind of market failure to expect and what solution to consider.</p>
    </DeepDive>
  </div>);
}

function Chapter12() {
  return (<div>
    <SectionTitle>Tax Structure</SectionTitle>
    <p><T t="marginal tax rate" /> = extra tax on the next dollar of income. This is what drives incentives (Ch. 1, Principle #3 — marginal thinking). If your marginal rate is 35%, you keep only 65 cents of the next dollar earned, which affects decisions to work more, save, or invest.</p>
    <p><T t="average tax rate" /> = total tax / total income. This measures the overall burden. The two rates are different because of deductions, brackets, and phase-outs.</p>
    <p>Tax systems can be <T t="progressive tax">progressive</T> (rate rises with income, like the U.S. income tax), <T t="regressive tax">regressive</T> (rate falls with income, like sales taxes that take a larger share of poor people's spending), or <T t="proportional tax">proportional</T> (flat rate regardless of income).</p>

    <SectionTitle>Efficiency in Taxation</SectionTitle>
    <p>An efficient tax system minimizes <T t="deadweight loss" /> (Ch. 6/8) and administrative costs. DWL arises because taxes distort decisions — they change the prices people face and push behavior away from the efficient outcome.</p>
    <p>From Ch. 5: taxes on goods with <T t="inelastic" /> demand or supply create less DWL because the tax base doesn't shrink much. This is why governments tax cigarettes and gasoline heavily — demand is inelastic.</p>
    <p>DWL grows with the square of the tax rate — doubling the rate quadruples DWL. This means broad-based taxes at moderate rates are more efficient than narrow taxes at high rates.</p>

    <SectionTitle>Equity in Taxation</SectionTitle>
    <p><T t="benefits principle" />: taxes proportional to benefits received. Works for gasoline taxes funding roads, but not for redistributive programs.</p>
    <p><T t="ability-to-pay principle" />: taxes reflect capacity to bear the burden. This implies <T t="horizontal equity" /> (similar situations → similar taxes) and <T t="vertical equity" /> (greater ability → larger taxes).</p>
    <Intuition>This is Ch. 1 Principle #1 in action: people face trade-offs, and so does tax policy. More progressive taxes mean more equity but higher marginal rates, which mean more distortion and more DWL. There is no free lunch in taxation.</Intuition>

    <DeepDive title="The Laffer Curve Revisited">
      <p>The <T t="laffer curve" /> from Ch. 6/8: at rate 0, revenue is 0. At 100%, nobody works, revenue is 0. Maximum revenue is somewhere in between. Because DWL grows with the square of the rate, there's a strong efficiency case for keeping rates moderate. The fundamental challenge of tax design: raise enough revenue for public goods (Ch. 11), correct externalities (Ch. 10), and redistribute income (Ch. 20), all while minimizing the efficiency costs.</p>
    </DeepDive>
  </div>);
}

function Chapter13() {
  return (<div>
    <SectionTitle>What Are Costs?</SectionTitle>
    <p>Economic cost includes <em>all</em> <T t="opportunity cost">opportunity costs</T> (Ch. 1) — explicit (dollars paid) and implicit (foregone alternatives). Economic profit = revenue − economic cost. It can be zero even when accounting profit is positive.</p>

    <SectionTitle>Production & Diminishing Returns</SectionTitle>
    <p>The production function maps inputs → output. <T t="diminishing marginal returns" />: as you add more of one input (holding others fixed), each extra unit adds less output. This is why <T t="marginal cost">MC</T> eventually rises.</p>

    <SectionTitle>Cost Curves</SectionTitle>
    <Formula>TC = FC + VC &nbsp;|&nbsp; ATC = AFC + AVC &nbsp;|&nbsp; MC = ΔTC/ΔQ</Formula>
    <p><T t="atc">ATC</T> is U-shaped: at low Q, spreading <T t="fixed costs" /> dominates (ATC falls). At high Q, rising <T t="marginal cost">MC</T> from diminishing returns dominates (ATC rises). The minimum is the <T t="efficient scale" />.</p>
    <p><strong>MC-ATC relationship:</strong> MC &lt; ATC → ATC falls. MC &gt; ATC → ATC rises. MC crosses ATC at the minimum.</p>
    <Intuition>GPA analogy: if your next semester's grades (MC) are above your cumulative GPA (ATC), your GPA rises. Below → it falls. Equal → the turning point.</Intuition>

    <p style={{ fontWeight: 200, color: C.heading, marginTop: 36 }}>Interactive: Cost Curves</p>
    <CostCurvesGraph />

    <SectionTitle>Short Run vs. Long Run</SectionTitle>
    <p><strong>Short run:</strong> At least one input is fixed. <strong>Long run:</strong> All inputs variable. Long-run ATC is the envelope of all short-run ATCs.</p>
    <p><T t="economies of scale" /> (ATC falls), constant returns, <T t="diseconomies of scale" /> (ATC rises from coordination problems).</p>
  </div>);
}

function Chapter14() {
  return (<div>
    <SectionTitle>The Competitive Firm</SectionTitle>
    <p>A <T t="competitive market" /> has many firms, identical products, and free entry/exit. The key result: each firm is a <T t="price taker" /> — it takes the market price as given. If it raises price even slightly, buyers go elsewhere. If it lowers price, it sacrifices revenue for nothing.</p>
    <p>For a competitive firm, Price = <T t="marginal revenue">MR</T> = Average Revenue. This is the crucial difference from a <T t="monopoly" /> (Ch. 15), where MR is less than P because the monopolist must cut price on all units to sell one more.</p>

    <SectionTitle>Profit Maximization</SectionTitle>
    <p>Produce where P = <T t="mc">MC</T>. Since P = MR for competitive firms, this is just the general MR = MC rule. The firm increases output as long as P exceeds MC (each unit adds to profit) and stops where they're equal.</p>
    <Formula>Profit = (P − ATC) × Q</Formula>
    <p>If P exceeds <T t="atc">ATC</T>, the firm earns positive economic profit. If P = ATC, <T t="zero economic profit" />. If P is below ATC, the firm takes a loss.</p>

    <SectionTitle>Shutdown & Exit</SectionTitle>
    <p><T t="shutdown condition" />: In the short run, shut down if P falls below <T t="avc">AVC</T> — producing would lose even more than just paying fixed costs. In the long run, exit if P is below ATC, since eventually all costs become variable.</p>
    <p>The firm's short-run supply curve is its MC curve above the AVC curve.</p>
    <Intuition>Keep the restaurant open if revenue covers food and waitstaff (variable costs), even if it doesn't cover rent (fixed costs) — because you owe rent either way. In the long run, the lease expires and you leave if you can't cover everything.</Intuition>

    <SectionTitle>Long-Run Equilibrium</SectionTitle>
    <p>Positive profit attracts entry → supply shifts right (Ch. 4) → price falls → profit falls. Losses cause exit → supply shifts left → price rises → losses shrink. This continues until <T t="zero economic profit" />: P = minimum <T t="atc">ATC</T>.</p>
    <p>Zero economic profit is not failure. The firm covers all costs including <T t="opportunity cost">opportunity costs</T> (Ch. 1). It earns a normal return — just not above-normal.</p>

    <DeepDive title="Why Competitive Markets Are Efficient">
      <p>Free entry is the great equalizer. In long-run equilibrium: P = MC (<T t="allocative efficiency" />, Ch. 7 — the right amount is produced), P = min ATC (<T t="productive efficiency" /> — produced at lowest possible cost), and zero economic profit (no resources wasted on above-normal returns). This is why Ch. 1 Principle #6 holds — competitive markets channel self-interest into social good. Every subsequent market structure (Ch. 15-17) is evaluated against this competitive benchmark.</p>
    </DeepDive>

    <p style={{ fontWeight: 200, color: C.heading, marginTop: 36 }}>Interactive: Firm Profit & Shutdown</p>
    <p style={{ color: C.textMuted, fontSize: 20 }}>Drag the market price and watch the firm's output, profit, and shutdown decision respond. Find the price where profit hits zero (long-run equilibrium), and the price where the firm shuts down.</p>
    <FirmProfitGraph />
  </div>);
}

function Chapter15() {
  return (<div>
    <SectionTitle>Why Monopolies Exist</SectionTitle>
    <p>A <T t="monopoly" /> has one seller, no close substitutes, high barriers. Sources: exclusive resources (rare), government grants (patents), <T t="natural monopoly" /> (ATC still declining — one firm is cheapest).</p>

    <SectionTitle>Monopoly Pricing</SectionTitle>
    <p>The <T t="price maker">monopolist</T> faces the market demand curve. To sell more, it must lower price on <em>all</em> units → <T t="mr">MR</T> &lt; P. Profit max at MR = <T t="mc">MC</T>, then read price off demand.</p>
    <Formula>1. Find Q where MR = MC → 2. Price = Demand(Q) → 3. Profit = (P − ATC) × Q</Formula>
    <Intuition>Selling 10 widgets at $10 = $100. To sell 11, cut price to $9.50 for ALL. Revenue = $104.50. MR of 11th = $4.50, not $9.50.</Intuition>

    <p style={{ fontWeight: 200, color: C.heading, marginTop: 36 }}>Interactive: Monopoly vs. Competition</p>
    <MonopolyGraph />

    <SectionTitle>Costs & Remedies</SectionTitle>
    <p>Monopoly restricts output below efficient level → <T t="deadweight loss" />. Some <T t="consumer surplus" /> transfers to the monopolist as profit (redistribution), but the DWL triangle is pure waste.</p>
    <p><T t="price discrimination" /> can reduce DWL by increasing output toward efficient levels (though surplus goes to the firm).</p>
    <DeepDive title="Policy Responses">
      <p><strong>Antitrust:</strong> Block mergers, break up monopolies, ban anticompetitive practices.</p>
      <p><strong>Regulation:</strong> MC pricing (efficient but may cause losses for natural monopolies since MC &lt; ATC). ATC pricing (breakeven but still below efficient Q).</p>
      <p><strong>Public ownership:</strong> Mixed results — government enterprises face poor incentives.</p>
      <p><strong>Do nothing:</strong> Sometimes the cure is worse, especially if the market is contestable.</p>
    </DeepDive>
  </div>);
}

function Chapter16() {
  return (<div>
    <SectionTitle>Monopolistic Competition</SectionTitle>
    <p><T t="monopolistic competition" /> has three features: many firms, <T t="product differentiation">differentiated products</T> (branding, quality, style), and free entry/exit. Each firm has some <T t="market power" /> — a downward-sloping demand curve — but faces competition from close substitutes. Examples: restaurants, clothing brands, apps, hairdressers.</p>

    <SectionTitle>Short Run vs. Long Run</SectionTitle>
    <p>In the short run, a monopolistically competitive firm behaves like a <T t="monopoly">monopolist</T> (Ch. 15): MR is less than P, it profit-maximizes at MR = MC, and it can earn positive economic profit.</p>
    <p>In the long run, it resembles <T t="competitive market">competition</T> (Ch. 14): positive profit attracts new firms with similar products. Entry shifts each existing firm's demand left (fewer customers per firm) and makes it more elastic (more substitutes). This continues until economic profit hits zero: P = ATC at the profit-maximizing quantity.</p>
    <Formula>Long-run: P = ATC (zero profit) but P &gt; MC (markup persists)</Formula>

    <SectionTitle>Efficiency Assessment</SectionTitle>
    <p>Compared to perfect competition (Ch. 14), monopolistic competition has two inefficiencies. First, markup over MC: since P exceeds MC, there is <T t="deadweight loss" /> from underproduction. Second, excess capacity: firms produce below the <T t="efficient scale" /> (Ch. 13) — there are "too many" firms, each underutilizing capacity.</p>
    <p>The counterargument: product variety has value. Consumers benefit from having many differentiated options even if each firm isn't maximally efficient. The inefficiency is the cost of choice.</p>
    <Intuition>There are a lot of restaurants in your town, each half-full. That is excess capacity. But would you prefer one giant efficient cafeteria? The variety is the point.</Intuition>

    <DeepDive title="Advertising & Branding">
      <p>Firms invest heavily in advertising because <T t="product differentiation">differentiation</T> is the source of their market power. Critics say advertising is wasteful — it manipulates rather than informs, raising ATC without real benefit. Defenders say it provides information, signals quality (only profitable firms can afford big campaigns), and enables competition by making consumers aware of alternatives. Brand names can create artificial differentiation (inefficient) or provide quality guarantees that reduce search costs (efficient). The truth is probably a mix.</p>
    </DeepDive>
  </div>);
}

function Chapter17() {
  return (<div>
    <SectionTitle>Strategic Interdependence</SectionTitle>
    <p>An <T t="oligopoly" /> has few sellers, each aware their actions affect rivals. This strategic interdependence is the defining feature — fundamentally different from competition (too small to matter) and monopoly (no rivals).</p>
    <p>The core tension: collectively, firms maximize profit by acting as a <T t="monopoly" /> (restrict output, raise price, Ch. 15 logic). Individually, each firm has an incentive to cheat — produce more than agreed and steal market share. A <T t="cartel" /> is a group attempting joint monopoly behavior, but the private incentive to cheat makes cartels inherently unstable.</p>
    <Intuition>Same logic as the <T t="tragedy of the commons" /> (Ch. 11): what's best for the group (restrict) conflicts with what's best for each individual (cheat). Self-interest undermines collective interest.</Intuition>

    <SectionTitle>The Prisoner's Dilemma</SectionTitle>
    <p><T t="game theory" /> is the tool for analyzing strategic interdependence. The central model is the <T t="prisoners dilemma" />: two firms choose between cooperating (restricting output) and defecting (overproducing).</p>
    <p>Defecting is a <T t="dominant strategy" /> — it's better regardless of what the other does. But when both defect, they're both worse off than if both had cooperated. The <T t="nash equilibrium" /> (both defect) is collectively suboptimal.</p>
    <Formula>Both cooperate → good profits for both</Formula>
    <Formula>One defects → defector profits greatly, cooperator gets crushed</Formula>
    <Formula>Both defect → mediocre profits (Nash equilibrium)</Formula>
    <p>In repeated interactions, cooperation becomes more sustainable through tit-for-tat strategies, reputation effects, and the ability to punish cheaters. Fewer firms, transparent pricing, and repeated play all help sustain cooperation.</p>

    <SectionTitle>Policy & the Market Structure Spectrum</SectionTitle>
    <p><T t="collusion" /> is illegal. Antitrust laws prohibit explicit price-fixing, though tacit collusion (parallel behavior without agreement) is harder to prosecute.</p>

    <DeepDive title="Where Oligopoly Fits">
      <p>From most to least competitive: Perfect competition (Ch. 14: P = MC, zero profit) → Monopolistic competition (Ch. 16: P above MC, zero profit, variety) → Oligopoly (depends on cooperation level) → Monopoly (Ch. 15: highest P, most DWL). As you move toward monopoly, price rises, quantity falls, <T t="deadweight loss">DWL</T> grows, and <T t="consumer surplus" /> shrinks. Every Ch. 7 concept in action across a spectrum of market structures.</p>
    </DeepDive>

    <p style={{ fontWeight: 200, color: C.heading, marginTop: 36 }}>Interactive: Prisoner's Dilemma</p>
    <p style={{ color: C.textMuted, fontSize: 20 }}>Pick strategies for two firms. Numbers represent profit (higher = better). Notice why both end up defecting even though mutual cooperation pays more.</p>
    <PrisonersDilemmaWidget />
  </div>);
}

function Chapter18() {
  return (<div>
    <SectionTitle>Labor Demand</SectionTitle>
    <p><T t="factors of production" /> — labor, land, capital — are bought and sold in factor markets. The analysis mirrors goods markets (Ch. 4) with roles reversed: firms are buyers, households are sellers.</p>
    <p><T t="derived demand" />: demand for labor derives from demand for the goods it produces. If demand for cars rises (Ch. 4 demand shift), demand for auto workers rises too.</p>
    <p>A competitive, profit-maximizing firm hires workers until the <T t="value of the marginal product">value of the marginal product (VMP)</T> equals the wage:</p>
    <Formula>VMP = MPL x P (marginal product of labor x output price)</Formula>
    <Formula>Hire until: VMP = Wage</Formula>
    <p>This is the same MR = MC logic from Ch. 14/15, applied to input decisions. The extra revenue from one more worker (VMP) equals the extra cost (wage).</p>
    <Intuition>A restaurant hires a cook if the revenue that cook generates (meals served x price per meal) exceeds their wage. That is the value of the marginal product.</Intuition>

    <SectionTitle>What Shifts Labor Demand?</SectionTitle>
    <p>Output price: if the product price rises, each worker's output is worth more, so labor demand shifts right. Technology: it can complement workers (better tools increase <T t="marginal product of labor">MPL</T>) or substitute for them (automation reduces demand). Supply of other factors: more capital available makes workers more productive.</p>

    <SectionTitle>Labor Supply</SectionTitle>
    <p>The labor supply curve reflects the <T t="opportunity cost" /> (Ch. 1) of leisure. When wages rise, there are two opposing effects: the <T t="substitution effect" /> (leisure is more expensive, so work more) and the <T t="income effect" /> (you're richer, so buy more leisure). Usually substitution dominates and labor supply slopes upward.</p>

    <SectionTitle>Capital, Land & Distribution</SectionTitle>
    <p>The same VMP logic applies to all factors. In competitive factor markets, each factor earns its VMP — the neoclassical theory of distribution. Your income reflects your productivity. If factors are paid VMP and output is priced at MC, <T t="allocative efficiency" /> (Ch. 7) extends to factor markets too.</p>

    <DeepDive title="Why Factor Markets Matter for Later Chapters">
      <p>This chapter provides the foundation for Ch. 19 (why wages differ — differences in MPL and VMP), Ch. 20 (income inequality — the distribution of factor payments), and even Ch. 6 (minimum wage as a price floor in the labor market). The VMP = Wage condition is the labor market's version of P = MC.</p>
    </DeepDive>
  </div>);
}

function Chapter19() {
  return (<div>
    <SectionTitle>Why Wages Differ</SectionTitle>
    <p>In a competitive labor market (Ch. 18), wages equal <T t="value of the marginal product">VMP</T>. So wage differences reflect productivity differences — but what drives those?</p>
    <p><T t="compensating differential">Compensating differentials</T>: dangerous, stressful, or unpleasant jobs pay more to attract workers. This is <T t="opportunity cost" /> (Ch. 1) applied to labor — the "cost" of a job includes its non-monetary downsides. Coal miners earn more than office workers in part because the job is risky.</p>
    <p><T t="human capital" /> — education, skills, training, experience — is the largest determinant of wage differences. More HC means higher <T t="marginal product of labor">MPL</T>, higher VMP, higher wage (Ch. 18 chain). Education is an investment: pay costs now (tuition, foregone wages) for higher future earnings.</p>

    <SectionTitle>Signaling & Above-Market Wages</SectionTitle>
    <p>The <T t="signaling" /> theory offers an alternative view: education may not increase productivity but instead signals pre-existing ability to employers. In reality, both effects likely operate.</p>
    <p>Some wages persist above the market-clearing level: minimum wage (a <T t="price floor" /> from Ch. 6, creating unemployment), unions (collective bargaining pushes wages up but may reduce employment), and <T t="efficiency wages" /> (firms voluntarily overpay to reduce turnover, incentivize effort, and attract better workers — the higher wage pays for itself through productivity).</p>

    <SectionTitle>Discrimination</SectionTitle>
    <p><T t="discrimination" /> means paying different wages (or denying opportunities) to equally productive workers based on personal characteristics. Competitive markets (Ch. 14) work against this: a discriminating firm has higher costs than a non-discriminating competitor and should be driven out.</p>
    <p>Discrimination persists through customer or employee preferences, statistical discrimination (using group averages as proxies when individual info is costly), and <T t="market power" /> (Ch. 15-17 firms with economic profit can afford the inefficiency of discrimination).</p>
    <Intuition>Observed wage gaps partly reflect discrimination, but also partly reflect differences in human capital, experience, occupation choice, hours worked, and compensating differentials. Disentangling these is one of the hardest empirical problems in economics.</Intuition>
  </div>);
}

function Chapter20() {
  return (<div>
    <SectionTitle>Measuring Inequality</SectionTitle>
    <p>Income inequality is measured by quintile shares (the top 20% of U.S. households earn roughly half of total income) or the Gini coefficient (0 = perfect equality, 1 = one person has everything). Inequality has risen over recent decades, driven by rising returns to <T t="human capital">education</T> (Ch. 19), technological change, and superstar effects.</p>
    <p>Important caveats: <T t="in-kind transfers" /> (food stamps, Medicaid, housing vouchers) aren't counted as income, making poverty look worse than it is. The economic life cycle means a snapshot overstates lifetime inequality (young people earn less, retirees draw down savings). And economic mobility means many people move between quintiles over a lifetime.</p>

    <SectionTitle>Philosophy of Redistribution</SectionTitle>
    <p><T t="utilitarian" /> (Bentham/Mill): maximize total happiness. Because of diminishing marginal utility of income (an extra dollar means more to a poor person), redistribution increases total utility. But too much redistribution reduces incentives to work and produce.</p>
    <p><T t="liberal">Rawlsian</T> (Rawls): design society from behind a "veil of ignorance" — not knowing your place in it. Result: maximize the welfare of the worst-off person (maximin). More redistribution than utilitarianism.</p>
    <p><T t="libertarian" /> (Nozick): redistribution violates property rights. Focus on process fairness (equal opportunity), not outcome equality. Minimal redistribution.</p>
    <Intuition>These aren't just abstract philosophies. The utilitarian asks "does this maximize total welfare?" The Rawlsian asks "does this help the worst-off?" The libertarian asks "does this respect individual rights?" Every policy debate maps to these frameworks.</Intuition>

    <SectionTitle>Anti-Poverty Policy</SectionTitle>
    <p>Minimum wage: a <T t="price floor" /> (Ch. 6) that helps workers who keep their jobs but may cause unemployment. The debate centers on <T t="elasticity">labor demand elasticity</T> (Ch. 5) — if demand is inelastic, job losses are small.</p>
    <p>Cash transfers risk reducing work incentives through high implicit <T t="marginal tax rate">marginal tax rates</T> (Ch. 12) as benefits phase out. The Earned Income Tax Credit (EITC) preserves work incentives because benefits increase with earned income. <T t="in-kind transfers" /> may be less efficient than cash (restricts choice) but can be better targeted. Education investment (<T t="human capital" />, Ch. 19) addresses root causes rather than symptoms.</p>

    <DeepDive title="The Efficiency-Equity Tradeoff Across the Course">
      <p>Every anti-poverty tool involves Ch. 1's fundamental trade-off. Redistribution helps equity but creates DWL. The question is always: how much efficiency loss is this redistribution worth? There is no objectively correct answer — it depends on your philosophical framework (utilitarian, Rawlsian, or libertarian) and empirical judgments about elasticities and incentive effects.</p>
    </DeepDive>
  </div>);
}

function Chapter21() {
  return (<div>
    <SectionTitle>The Budget Constraint</SectionTitle>
    <p>The <T t="budget constraint" /> shows all affordable combinations of two goods given income and prices. It's a straight line with slope = -P1/P2, which represents the <T t="opportunity cost" /> (Ch. 1) of Good 1 in terms of Good 2 — the rate at which the market lets you trade one for the other.</p>
    <p>An income increase shifts the budget line outward (parallel). A price change pivots it (the slope changes).</p>

    <SectionTitle>Indifference Curves & Optimization</SectionTitle>
    <p><T t="indifference curve">Indifference curves</T> show combinations of goods giving equal satisfaction. Higher curves are better. They slope downward (giving up one good requires more of the other), don't cross, and bow inward (reflecting diminishing <T t="marginal rate of substitution">MRS</T> — the more of a good you have, the less you value one more unit).</p>
    <p>The consumer chooses the point on the budget constraint that reaches the highest indifference curve. At the optimum:</p>
    <Formula>MRS = P1 / P2 (willingness to trade = market trade rate)</Formula>
    <p>This is the individual-level foundation of <T t="allocative efficiency" /> (Ch. 7): prices guide each consumer to their best feasible outcome.</p>
    <Intuition>The bowed shape reflects a preference for variety. If you have 10 pizzas and 1 salad, you'd trade several pizzas for one salad. This is Ch. 1's marginal thinking made visual.</Intuition>

    <SectionTitle>Deriving the Demand Curve</SectionTitle>
    <p>When a good's price changes, two effects occur simultaneously. The <T t="substitution effect" /> always opposes the price change — a cheaper good becomes relatively more attractive. The <T t="income effect" /> reflects the change in purchasing power — a price drop makes you effectively richer.</p>
    <p>For normal goods, both effects reinforce each other, so demand slopes down (Ch. 4). For inferior goods, the effects oppose each other, but the substitution effect usually dominates. For the extremely rare <T t="giffen good" />, the income effect dominates for an inferior good that's a large share of the budget, producing an upward-sloping demand curve.</p>

    <DeepDive title="Why This Chapter Matters">
      <p>This chapter reveals the engine behind Ch. 4's demand curve. The "law of demand" isn't just an empirical observation — it emerges logically from rational consumer choice. Every time you use a demand curve in this course, this optimization framework is running underneath. The <T t="substitution effect" /> and <T t="income effect" /> decomposition also appears in Ch. 18's labor supply analysis (work vs. leisure tradeoff).</p>
    </DeepDive>
  </div>);
}

function Chapter22() {
  return (<div>
    <SectionTitle>Asymmetric Information</SectionTitle>
    <p><T t="moral hazard" />: unmonitored party behaves carelessly (insurance → recklessness). <T t="adverse selection" />: bad types self-select into deals (sick people buy insurance → premiums spiral).</p>
    <p>Solutions: deductibles (moral hazard), <T t="signaling" /> and screening (adverse selection, Ch. 19), mandates.</p>
    <p>Both are market failures — the invisible hand (Ch. 1) breaks down with asymmetric info, just as it does with <T t="externality">externalities</T> (Ch. 10) and <T t="market power" /> (Ch. 15).</p>

    <SectionTitle>Political Economy</SectionTitle>
    <p><T t="condorcet paradox" />: majority voting can cycle. <T t="arrows impossibility theorem" />: no perfect voting system exists. <T t="median voter theorem" />: outcomes reflect the median voter → candidates converge to center.</p>

    <SectionTitle>Behavioral Economics</SectionTitle>
    <p>People use heuristics, are present-biased, loss-averse, and susceptible to framing effects. Policy implication: <strong>nudges</strong> — structure choices to help people decide better without restricting freedom ("libertarian paternalism").</p>
    <Intuition>The course comes full circle. Ch. 1 said markets usually work (Principle #6) but sometimes fail (Principle #7). Now we've catalogued every way markets fail — externalities, public goods, market power, asymmetric info — and every way governments fail too. The question is never perfect market vs. perfect government; it's which imperfect institution fails less badly.</Intuition>
  </div>);
}
